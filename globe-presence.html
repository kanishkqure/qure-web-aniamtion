<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qure Global Presence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;display:grid;place-items:center;min-height:100vh}
.qure-globe-wrap{width:min(720px,100% - 32px);margin:0 auto;padding:24px 0}
/* ---- component ---- */
.qure-globe{position:relative;font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#303030}
.qure-globe .mono{font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.qure-globe .qg-stage{position:relative;width:100%;aspect-ratio:1/1}
.qure-globe canvas,.qure-globe .qg-overlay{position:absolute;inset:0;width:100%;height:100%;display:block}
.qure-globe .qg-overlay{overflow:visible;pointer-events:none}
.qure-globe .reg{fill:none;stroke:#C9C9D4;stroke-width:1;vector-effect:non-scaling-stroke}
.qure-globe .limb{fill:none;stroke:#303030;stroke-opacity:.25;stroke-width:1;vector-effect:non-scaling-stroke}
.qure-globe .orbit{fill:none;stroke:#303030;stroke-opacity:.12;stroke-width:1;vector-effect:non-scaling-stroke}
.qure-globe .ticks{fill:none;stroke:#8A8A99;stroke-width:1;vector-effect:non-scaling-stroke}
.qure-globe .ticks .minor{stroke-opacity:.45}
.qure-globe .tick-lbl{font-size:14px;fill:#8A8A99;letter-spacing:.12em}
.qure-globe .qg-chip-row{display:flex;justify-content:center;margin-top:8px}
.qure-globe .qg-chip{display:inline-flex;align-items:center;gap:8px;height:22px;padding:0 12px 0 10px;box-sizing:border-box;border:1px solid #E6E6F0;border-radius:11px;background:#fff;font-size:10px;line-height:1;letter-spacing:.12em;white-space:nowrap}
.qure-globe .qg-chip .sdot{width:7px;height:7px;border-radius:50%;background:#FF7869;flex:none}
.qure-globe .qg-chip .sep{color:#8A8A99}
@media (max-width:639px){.qure-globe .tick-lbl{display:none}}
</style>
</head>
<body>
<div class="qure-globe-wrap">
<!-- qure global presence globe: copy this block plus the component CSS and script -->
<figure class="qure-globe" role="img" aria-label="Rotating globe of dots marking the countries where qure.ai is present, across the Americas, Europe, the Middle East, Africa, South and Southeast Asia, Japan and Australia." style="margin:0">
  <div class="qg-stage">
    <canvas aria-hidden="true"></canvas>
    <svg class="qg-overlay" viewBox="0 0 1000 1000" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <g class="reg">
        <g transform="translate(14 14)"><path d="M-9 0h18M0-9v18"/><circle r="4"/></g>
        <g transform="translate(986 14)"><path d="M-9 0h18M0-9v18"/><circle r="4"/></g>
        <g transform="translate(14 986)"><path d="M-9 0h18M0-9v18"/><circle r="4"/></g>
        <g transform="translate(986 986)"><path d="M-9 0h18M0-9v18"/><circle r="4"/></g>
      </g>
      <circle class="orbit" cx="500" cy="500" r="420"/>
      <g class="ticks"></g>
      <g class="tick-lbls mono"></g>
      <circle class="limb" cx="500" cy="500" r="360"/>
    </svg>
  </div>
  <figcaption class="qg-chip-row">
    <span class="qg-chip mono" aria-live="polite"><span class="sdot"></span><span><span>NOW VIEWING</span> <span class="sep">·</span> <span class="qg-region">MIDDLE EAST</span></span></span>
  </figcaption>
</figure>
</div>
<script>
(function () {
  // TODO: replace with official qure.ai country list before launch
  const QURE_COUNTRIES = [
    // Americas
    'USA', 'CAN', 'MEX', 'GTM', 'PAN', 'COL', 'PER', 'BRA', 'CHL', 'ARG',
    // Europe
    'GBR', 'IRL', 'FRA', 'DEU', 'NLD', 'BEL', 'ESP', 'PRT', 'ITA', 'CHE', 'AUT', 'POL', 'SWE', 'DNK', 'GRC', 'ROU',
    // Middle East
    'TUR', 'SAU', 'ARE', 'OMN', 'QAT', 'KWT', 'BHR', 'JOR',
    // Africa
    'EGY', 'MAR', 'NGA', 'GHA', 'CIV', 'SEN', 'CMR', 'COD', 'KEN', 'ETH', 'TZA', 'UGA', 'RWA', 'ZMB', 'MWI', 'MOZ', 'ZWE', 'ZAF',
    // South Asia
    'IND', 'PAK', 'BGD', 'NPL', 'LKA',
    // Southeast Asia
    'IDN', 'MYS', 'SGP', 'THA', 'VNM', 'PHL', 'KHM', 'MMR',
    // Asia Pacific
    'JPN', 'AUS',
  ];

  // Ping hubs [lat, lon] — each must sit inside a presence country.
  const HUBS = [
    [40.7, -74.0],   // New York
    [-23.5, -46.6],  // São Paulo
    [51.5, -0.1],    // London
    [25.2, 55.3],    // Dubai
    [-1.3, 36.8],    // Nairobi
    [19.1, 72.9],    // Mumbai
    [-6.2, 106.8],   // Jakarta
    [-33.9, 151.2],  // Sydney
  ];

  // Chip regions by the longitude facing the viewer (nearest centre wins).
  const REGIONS = [
    ['AMERICAS', -75], ['EUROPE', 8], ['AFRICA', 24], ['MIDDLE EAST', 48],
    ['SOUTH ASIA', 78], ['SOUTHEAST ASIA', 108], ['ASIA PACIFIC', 142],
  ];

  const C = {
    land: '#BDBCF0', presence: '#FF7869', grat: '#D9D9FF',
    tilt: 15,             // degrees, north pole toward the viewer
    staticLon: 60,        // reduced-motion / review frame centre
    radius: .36,          // globe radius as a fraction of stage width
    dot: .24,             // dot radius as a fraction of dot spacing
    presenceScale: 1.3,
    backAlpha: .12,
    gratAlpha: .35,
  };
  const RAD = Math.PI / 180;

  // ---------------------------------------------------------------- data
  function decode(set, codes) {
    const presence = new Set(QURE_COUNTRIES);
    const lat = [], sinL = [], cosL = [], isP = [];
    set.rows.forEach(function (row) {
      const la = -90 + (row[0] + .5) * set.step;
      const n = Math.max(1, Math.round(360 * Math.cos(la * RAD) / set.step));
      let k = 0;
      for (let i = 1; i < row.length; i += 3) {
        k += row[i];
        const p = presence.has(codes[row[i + 2]]);
        for (let j = 0; j < row[i + 1]; j++, k++) {
          const lo = (-180 + (k + .5) * 360 / n) * RAD;
          lat.push(la * RAD); sinL.push(Math.sin(lo)); cosL.push(Math.cos(lo)); isP.push(p);
        }
      }
    });
    const N = lat.length, d = { N: N, step: set.step, cp: new Float32Array(N), sp: new Float32Array(N),
      sl: Float32Array.from(sinL), cl: Float32Array.from(cosL), p: Uint8Array.from(isP) };
    for (let i = 0; i < N; i++) { d.cp[i] = Math.cos(lat[i]); d.sp[i] = Math.sin(lat[i]); }
    return d;
  }

  // ---------------------------------------------------------------- overlay
  function buildOverlay(svg) {
    const NS = 'http://www.w3.org/2000/svg', R = 420;
    let d = '';
    for (let a = 0; a < 360; a += 10) {
      const major = a % 90 === 0, len = major ? 12 : 5;
      const s = Math.sin(a * RAD), c = -Math.cos(a * RAD);
      const p = function (r) { return (500 + s * r).toFixed(1) + ' ' + (500 + c * r).toFixed(1); };
      if (major) d += 'M' + p(R - len / 2) + 'L' + p(R + len / 2);
      else svg.querySelector('.ticks').insertAdjacentHTML('beforeend', '<path class="minor" d="M' + p(R) + 'L' + p(R + len) + '"/>');
      if (major) {
        const t = document.createElementNS(NS, 'text'), r = R + 28;
        t.setAttribute('class', 'tick-lbl');
        t.setAttribute('x', (500 + s * r).toFixed(1));
        t.setAttribute('y', (500 + c * r + 5).toFixed(1));
        t.setAttribute('text-anchor', 'middle');
        t.textContent = ('00' + a).slice(-3) + '°';
        svg.querySelector('.tick-lbls').appendChild(t);
      }
    }
    svg.querySelector('.ticks').insertAdjacentHTML('afterbegin', '<path d="' + d + '"/>');
  }

  // ---------------------------------------------------------------- renderer
  function init(fig) {
    const canvas = fig.querySelector('canvas'), ctx = canvas.getContext('2d');
    const raw = globeData(), codes = raw.codes.split(',');
    const sets = { desktop: decode(raw.desktop, codes), mobile: decode(raw.mobile, codes) };
    const narrow = matchMedia('(max-width: 639px)');
    let W = 0, dpr = 1, data = sets.desktop;
    buildOverlay(fig.querySelector('.qg-overlay'));

    const LEVELS = 16;
    const bucket = [];
    for (let i = 0; i < LEVELS * 4; i++) bucket.push([]);  // [front land, front presence, back land, back presence]

    function render(lon0) {
      const R = W * C.radius, cx = W / 2, cy = W / 2;
      const sl0 = Math.sin(lon0 * RAD), cl0 = Math.cos(lon0 * RAD);
      const st = Math.sin(C.tilt * RAD), ct = Math.cos(C.tilt * RAD);
      const base = R * data.step * RAD * C.dot;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, W);
      for (let i = 0; i < bucket.length; i++) bucket[i].length = 0;

      // Project: rotate by lon0 about the pole, then tilt about the x axis.
      const N = data.N, xs = new Float32Array(N), ys = new Float32Array(N), zs = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        const sd = data.sl[i] * cl0 - data.cl[i] * sl0, cd = data.cl[i] * cl0 + data.sl[i] * sl0;
        const x = data.cp[i] * sd, y = data.sp[i], z = data.cp[i] * cd;
        const y2 = y * ct - z * st, z2 = y * st + z * ct;
        xs[i] = cx + R * x; ys[i] = cy - R * y2; zs[i] = z2;
        if (z2 < 0) {
          // back dots also thin out toward the limb, where they would pile up behind the edge
          const f = Math.min(1, -z2 / .35);
          bucket[(2 + data.p[i]) * LEVELS + Math.min(LEVELS - 1, Math.floor(f * f * (3 - 2 * f) * LEVELS))].push(i);
        } else {
          // limb fade: transparent-ish at the edge, full opacity by ~25° in from it
          const f = Math.min(1, z2 / .42), a = .18 + .82 * f * f * (3 - 2 * f);
          bucket[data.p[i] * LEVELS + Math.min(LEVELS - 1, Math.floor(a * LEVELS))].push(i);
        }
      }

      function dots(list, r, color, alpha) {
        if (!list.length) return;
        ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.beginPath();
        for (let j = 0; j < list.length; j++) {
          const i = list[j], rr = r * (.55 + .45 * Math.sqrt(Math.abs(zs[i])));
          ctx.moveTo(xs[i] + rr, ys[i]); ctx.arc(xs[i], ys[i], rr, 0, 2 * Math.PI);
        }
        ctx.fill();
      }

      // back hemisphere (seen through the globe)
      for (let p = 0; p < 2; p++) for (let l = 0; l < LEVELS; l++) {
        dots(bucket[(2 + p) * LEVELS + l], (p ? base * C.presenceScale : base) * .85, p ? C.presence : C.land, C.backAlpha * (l + .5) / LEVELS);
      }

      // graticule, front hemisphere only
      ctx.globalAlpha = C.gratAlpha; ctx.strokeStyle = C.grat; ctx.lineWidth = 1; ctx.beginPath();
      const proj = function (la, lo) {
        const cp = Math.cos(la * RAD), d = (lo - lon0) * RAD;
        const x = cp * Math.sin(d), y = Math.sin(la * RAD), z = cp * Math.cos(d);
        return [cx + R * x, cy - R * (y * ct - z * st), y * st + z * ct];
      };
      const line = function (pt) {
        let pen = false;
        for (let s = 0; s <= 120; s++) {
          const q = pt(s / 120);
          if (q[2] < 0) { pen = false; continue; }
          pen ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); pen = true;
        }
      };
      for (let lo = -180; lo < 180; lo += 30) line(function (t) { return proj(-90 + 180 * t, lo); });
      for (let la = -60; la <= 60; la += 30) line(function (t) { return proj(la, -180 + 360 * t); });
      ctx.stroke();

      // front hemisphere
      for (let p = 0; p < 2; p++) for (let l = 0; l < LEVELS; l++) {
        dots(bucket[p * LEVELS + l], p ? base * C.presenceScale : base, p ? C.presence : C.land, (l + .5) / LEVELS);
      }
      ctx.globalAlpha = 1;
    }

    function resize() {
      const w = fig.querySelector('.qg-stage').clientWidth;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = w; canvas.width = Math.round(w * dpr); canvas.height = Math.round(w * dpr);
      data = narrow.matches ? sets.mobile : sets.desktop;
      render(C.staticLon);
    }
    new ResizeObserver(resize).observe(fig.querySelector('.qg-stage'));
    narrow.addEventListener('change', resize);
  }

  [].forEach.call(document.querySelectorAll('.qure-globe'), init);

  // Generated by scripts/build-globe-data.mjs — do not edit by hand.
/* @globe-data:start (generated) */
