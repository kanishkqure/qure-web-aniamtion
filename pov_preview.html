  tick();

  if (io) io.observe(sec);
  A.destroy = () => { clearTimeout(timer); if (io) io.disconnect(); host.innerHTML = ''; };
  return A;
}


// ---------- Ribbon: one long, soft brush stroke of light, rasterised once per viewport size ----------
// Geometry is in ribbon-local units: u ∈ [-1, 1] along the length (u = +1 is the head), origin at the ribbon's centre.
const RIB = { len: 2.5, thick: 0.45, blur: 60, bodyU: 0.7, rise: 0.32, restY: 0.52, s0: 0.65, s1: 1.08, o0: 0.45, o1: 0.8, lift: 0.07 };
const cubicBezier = (x1, y1, x2, y2) => {
  const bx = t => 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t, by = t => 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1, t = x; for (let i = 0; i < 28; i++) { t = (lo + hi) / 2; if (bx(t) < x) lo = t; else hi = t; } return by(t); };
};
const smooth = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
function povRibbon(host) {
  const c = document.createElement('canvas'); c.className = 'rib'; host.appendChild(c);
  const R = { c, W: 0, H: 0, last: null };
  R.render = (W, H) => {
    if (W === R.W && H === R.H) return; R.W = W; R.H = H; if (!W || !H) return;
    const L = RIB.len * W, sg = RIB.blur * W / 1440, pad = Math.ceil(3 * sg);
    const half = u => 0.5 * RIB.thick * H * (1 - 0.5 * u * u);                               // thickest at the centre
    const yc = u => -RIB.rise * H * (1 - Math.exp(-(u / 0.42) * (u / 0.42)));                  // shallow smile, ends rise
    let top = 0, bot = 0; for (let i = 0; i <= 400; i++) { const u = -1 + i / 200; top = Math.min(top, yc(u) - half(u)); bot = Math.max(bot, yc(u) + half(u)); }
    const rEnd = half(1), ox = L / 2 + rEnd + pad, oy = -top + pad, cw = 2 * ox, ch = bot - top + 2 * pad;
    const k = Math.min(1, Math.sqrt(5e6 / (cw * ch)));
    c.width = Math.ceil(cw * k); c.height = Math.ceil(ch * k);
    Object.assign(c.style, { width: cw + 'px', height: ch + 'px', transformOrigin: ox + 'px ' + oy + 'px' });
    Object.assign(R, { L, sg, pad, ox, oy, rEnd, half, yc, ext: L / 2 + rEnd + pad });
    const x = c.getContext('2d'); x.setTransform(k, 0, 0, k, ox * k, oy * k);
    // Union of discs along the centreline = variable-width stroke with naturally rounded caps. Blurred once via an offset shadow.
    const off = c.width + 64; x.save(); x.shadowColor = '#000'; x.shadowBlur = 2 * sg * k; x.shadowOffsetX = off; x.translate(-off / k, 0); x.beginPath();
    const N = Math.ceil(L / 3);
    for (let i = 0; i <= N; i++) { const u = -1 + 2 * i / N, r = half(u), px = u * L / 2, py = yc(u); x.moveTo(px + r, py); x.arc(px, py, r, 0, Math.PI * 2); }
    x.fillStyle = '#000'; x.fill('nonzero'); x.restore();
    // Colour runs along the length: tail (u=-1) lavender-peach, body peach/lavender, head (u=+1) Qure Peach. Both caps fade to 0.
    const g = x.createLinearGradient(-L / 2 - rEnd, 0, L / 2 + rEnd, 0), at = px => (px + L / 2 + rEnd) / (L + 2 * rEnd), bU = RIB.bodyU * L / 2;
    g.addColorStop(0, 'rgba(230,185,207,0)'); g.addColorStop(at(-bU - (L / 2 + rEnd - bU) * 0.65), 'rgba(230,185,207,0.14)'); g.addColorStop(at(-bU - (L / 2 + rEnd - bU) * 0.3), 'rgba(230,185,207,0.55)');
    g.addColorStop(at(-bU), 'rgba(230,185,207,0.9)'); g.addColorStop(0.5, 'rgba(239,162,166,0.88)'); g.addColorStop(at(bU), 'rgba(255,120,105,0.85)');
    g.addColorStop(at(bU + (L / 2 + rEnd - bU) * 0.3), 'rgba(255,120,105,0.52)'); g.addColorStop(at(bU + (L / 2 + rEnd - bU) * 0.65), 'rgba(255,120,105,0.13)'); g.addColorStop(1, 'rgba(255,120,105,0)');
    x.globalCompositeOperation = 'source-in'; x.fillStyle = g; x.fillRect(-ox, -oy, cw, ch);
    x.globalCompositeOperation = 'source-atop'; let sd = 7; const rnd = () => (sd = sd * 16807 % 2147483647) / 2147483647;   // barely-there fibres, ≤3% contrast
    for (let sx = -L / 2 - rEnd; sx < L / 2 + rEnd; sx += 3 + rnd() * 9) { x.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,' + (0.01 + rnd() * 0.02).toFixed(3) + ')' : 'rgba(150,60,90,' + (0.008 + rnd() * 0.014).toFixed(3) + ')'; x.fillRect(sx, -oy, 1 + rnd() * 1.5, ch); }
    x.globalCompositeOperation = 'source-over';
  };
  // Pose for eased progress e ∈ [0, 1]. dir +1 travels left→right (head leading on the right); dir −1 is the mirror image.
  R.pose = (dir, e) => {
    const W = R.W, H = R.H, cx0 = -RIB.s0 * R.ext, cx1 = W + RIB.s1 * R.ext, ec = (W / 2 - cx0) / (cx1 - cx0), a = smooth(e / ec), b = smooth((e - ec) / (1 - ec));
    const cx = cx0 + (cx1 - cx0) * e, s = e < ec ? RIB.s0 + (1 - RIB.s0) * a : 1 + (RIB.s1 - 1) * b, o = e < ec ? RIB.o0 + (1 - RIB.o0) * a : 1 - (1 - RIB.o1) * b;
    const X = dir > 0 ? cx : W - cx, Y = RIB.restY * H - (e < ec ? RIB.lift * H * (1 - a) : 0);
    c.style.transform = 'translate3d(' + (X - R.ox).toFixed(2) + 'px,' + (Y - R.oy).toFixed(2) + 'px,0) scale(' + (dir > 0 ? s : -s).toFixed(4) + ',' + s.toFixed(4) + ')';
    c.style.opacity = o.toFixed(3);

    return R.last = { e, X, Y, s, o, dir, bodyX: X + dir * body, x0: X - span, x1: X + span };   // bodyX: where the head's full-thickness body begins
  };
  // Front-most x at which the ribbon's dense core (full-opacity body, inside the blur) covers height y.
  // The curve rises toward the head, so this differs per text line; a line is swapped only once it is really under the ribbon.
  R.front = y => {
    const q = R.last; if (!q) return -1e5; const m = 0.6 * R.sg; let bu = 0, bd = 1e9;
    for (let i = 0; i <= 160; i++) { const u = RIB.bodyU * (1 - i / 80), d = Math.abs(q.Y + q.s * R.yc(u) - y) - (q.s * R.half(u) - m); if (d <= 0) { bu = u; break; } if (d < bd) { bd = d; bu = u; } }
    return q.X + q.dir * q.s * bu * R.L / 2;
  };
  R.hide = () => { c.style.opacity = '0'; c.style.transform = 'translate3d(' + (-R.ox - 10 * R.W) + 'px,0,0)'; R.last = null; };
  return R;
}

// ---------- Preview controller: frames, unveil masks, input lock, review bar ----------
(() => {
  const sec = document.querySelector('[data-sec="pov"]'), bar = document.querySelector('.rv');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const F = [1, 2].map(i => { const el = sec.querySelector('[data-pov-frame="' + i + '"]'); return { el, ov: el.querySelector('[data-pov-ov]'), g: el.querySelector('[data-pov-group]'), parts: [el.querySelector('[data-pov-ov]'), ...el.querySelectorAll('[data-pov-line]')], mk: null }; });
  const art = povArt(sec.querySelector('[data-pov-art]'), sec), rib = povRibbon(sec.querySelector('[data-pov-swoosh]'));
  const P = { shown: 0, busy: false, cool: 0, speed: 1, run: null, lastWheel: 0, lastAbs: 0 };
  const COOL = 300, FEATHER = 160;
  // Review overrides, e.g. ?ease=0.3,0.15,0.7,0.85&dur=2400 (desktop ms; mobile keeps the 1800/2400 ratio). Defaults are the brief's.
  const qs = new URLSearchParams(location.search), qe = (qs.get('ease') || '').split(',').map(Number), qd = +qs.get('dur');
  const ease = cubicBezier(...(qe.length === 4 && qe.every(n => isFinite(n)) ? qe : [0.45, 0, 0.25, 1])), BASE = qd > 0 ? qd : 2400;
  const show = (f, on) => { f.ov.style.opacity = f.g.style.opacity = on ? '1' : '0'; };
  const maskSet = f => { const r0 = sec.getBoundingClientRect(); f.mk = f.parts.map(el => { const r = el.getBoundingClientRect(); return { el, x: r.left - r0.left, y: (r.top + r.bottom) / 2 - r0.top }; }); };
  // Per text line: edge = where the ribbon core covers that line. Incoming text fades in over the FEATHER behind the edge,
  // outgoing text fades out over the FEATHER ahead of it, so the two never overlap. c0 = alpha left of the feather.
  const mask = (f, dir, incoming) => { for (const m of f.mk) {
    const x = rib.front(m.y), a = (dir > 0) === incoming ? x - FEATHER : x, c0 = (dir > 0) === incoming ? 1 : 0;
    const s = 'linear-gradient(90deg,rgba(0,0,0,' + c0 + ') ' + (a - m.x).toFixed(1) + 'px,rgba(0,0,0,' + (1 - c0) + ') ' + (a + FEATHER - m.x).toFixed(1) + 'px)';
    m.el.style.webkitMaskImage = m.el.style.maskImage = s; } };
  const unmask = f => { (f.mk || []).forEach(m => { m.el.style.webkitMaskImage = m.el.style.maskImage = ''; }); f.mk = null; };

  function layout() {
    const W = innerWidth, H = innerHeight, mob = W <= 1023;
    if (reduced) { sec.style.height = 'auto'; F.forEach(f => { Object.assign(f.el.style, { position: 'relative', top: '0px', height: 'auto' }); show(f, true); }); }
    else {
      const FH = mob ? H : 800; sec.style.height = H + 'px';
      F.forEach(f => Object.assign(f.el.style, { position: 'absolute', top: ((H - FH) / 2) + 'px', height: FH + 'px', justifyContent: mob ? 'center' : '' }));
      rib.render(W, H); if (!P.run) rib.hide();
    }
    const sr = sec.getBoundingClientRect(), rel = el => { const r = el.getBoundingClientRect(); return { l: r.left - sr.left, r: r.right - sr.left, t: r.top - sr.top, b: r.bottom - sr.top }; };
    art.layout(sec.clientWidth, sec.clientHeight, F.map(f => f.parts.map(rel)), reduced ? 'static' : 'pin', !reduced);
  }

  // One rAF timeline drives the ribbon pose AND both masks, so they cannot drift apart.
  function play(to, done) {
    const from = P.shown; if (from === to || reduced) return;
    const dir = to > from ? 1 : -1, inF = to ? F[to - 1] : null, outF = from ? F[from - 1] : null;
    const dur = (innerWidth <= 1023 ? BASE * 0.75 : BASE) / P.speed;
    P.busy = true; P.shown = to; if (inF) { maskSet(inF); show(inF, true); } if (outF) maskSet(outF);
    const frame = e => {
      const q = rib.pose(dir, e);
      if (inF) mask(inF, dir, true); if (outF) mask(outF, dir, false);
      art.tint(q.x0, q.x1, 0, sec.clientHeight);
    };
    const run = P.run = { t0: performance.now(), dur, frame, finish: () => {
      if (P.run !== run) return; P.run = null; cancelAnimationFrame(run.raf); clearTimeout(run.safety);
      if (outF) { show(outF, false); unmask(outF); } if (inF) unmask(inF); rib.hide(); art.tint();
      P.busy = false; P.cool = Date.now() + COOL; done && done();
    } };
    frame(0);
    const step = now => { if (P.run !== run) return; const t = Math.min(1, Math.max(0, (now - run.t0) / dur)); frame(ease(t)); if (t < 1) run.raf = requestAnimationFrame(step); else run.finish(); };
    run.raf = requestAnimationFrame(step); run.safety = setTimeout(() => { if (P.run === run) { frame(1); run.finish(); } }, dur + 500);
  }
  const settle = () => { if (P.run) { P.run.frame(1); P.run.finish(); } P.cool = 0; };
  const jump = n => { settle(); F.forEach((f, i) => show(f, i === n - 1)); P.shown = n; };

  // Page-style triggers: one gesture = one step, locked until the ribbon has left plus 300ms.
  function gesture(d) {
    if (P.busy || Date.now() < P.cool) return;
    if (d > 0 && P.shown < 2) play(P.shown + 1); else if (d < 0 && P.shown > 0) play(P.shown - 1);
  }
  addEventListener('wheel', e => { if (reduced) return; e.preventDefault(); const now = Date.now(), a = Math.abs(e.deltaY), fresh = now - P.lastWheel > 220 || a > P.lastAbs * 1.6 + 8; P.lastWheel = now; P.lastAbs = a; if (a >= 4 && fresh) gesture(e.deltaY > 0 ? 1 : -1); }, { passive: false });
  let tY = null;
  addEventListener('touchstart', e => { tY = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchmove', e => { if (!reduced) e.preventDefault(); }, { passive: false });
  addEventListener('touchend', e => { if (tY == null) return; const dy = tY - (e.changedTouches[0] || {}).clientY; tY = null; if (Math.abs(dy) > 30) gesture(dy > 0 ? 1 : -1); });
  addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'h' || k === 'H') { bar.hidden = !bar.hidden; return; }
    const d = (k === 'ArrowDown' || k === 'PageDown' || (k === ' ' && !e.shiftKey)) ? 1 : (k === 'ArrowUp' || k === 'PageUp' || (k === ' ' && e.shiftKey)) ? -1 : 0;
    if (!d || reduced) return; e.preventDefault(); if (!e.repeat) gesture(d);
  });

  // Review bar. Buttons may interrupt a sweep (they settle it first); scroll and keys respect the lock.
  const speedBtn = bar.querySelector('[data-rv="speed"]'), SPEEDS = [1, 0.5, 0.25];
  bar.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const a = b.dataset.rv; b.blur();
    if (a === 'speed') { P.speed = SPEEDS[(SPEEDS.indexOf(P.speed) + 1) % SPEEDS.length]; speedBtn.textContent = 'Speed ' + P.speed + '×'; return; }
    if (reduced) { if (a === 'f1' || a === 'f2') F[a === 'f1' ? 0 : 1].el.scrollIntoView({ block: 'center' }); return; }
    if (a === 'replay') { jump(0); play(1); }
    else if (a === 'f1') { if (P.shown === 2) { settle(); play(1); } else { jump(0); play(1); } }
    else if (a === 'f2') { jump(1); play(2); }
    else if (a === 'reverse') { if (P.shown === 0) jump(2); else settle(); play(P.shown - 1); }
  });
  if (reduced) { document.documentElement.classList.add('rm'); bar.querySelectorAll('[data-rv="replay"],[data-rv="reverse"],[data-rv="speed"]').forEach(b => { b.disabled = true; }); }

  let rsW = innerWidth; addEventListener('resize', () => { if (innerWidth !== rsW) { rsW = innerWidth; settle(); } layout(); });
  layout(); if (document.fonts) document.fonts.ready.then(layout);
  window.povPreview = { state: () => ({ shown: P.shown, busy: P.busy, speed: P.speed, pose: rib.last }), front: y => rib.front(y), play, jump, settle };
})();

</script>
