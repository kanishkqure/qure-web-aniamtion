<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Hospital, One Year with QCT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<!--
  Your Hospital, One Year with QCT — RSNA booth prototype (qure.ai)

  One file, two views, kept in sync with BroadcastChannel (+ localStorage fallback):
    qct-one-year.html#tablet   visitor input screen, designed at 1180×820
    qct-one-year.html#wall     LED wall, designed at 1920×1080
    qct-one-year.html#preview  both views side by side (desk testing)
    qct-one-year.html          launcher
  Press D in either view for the dev panel.

  Sections (search for "=== "):
    STYLE    every colour, font, size and timing as CSS custom properties
    MARKUP   structure only; copy is injected from CONFIG.copy
    CONFIG   every assumption (PLACEHOLDER), copy text, intro flag
    ENGINE   pure deterministic model; never touches the DOM
    TIMELINE pure phase clock
    SYNC     cross-window state
    RENDER   reads engine output only (shared helpers, wall, tablet)
    DEV      dev panel
    BOOT     router + frame loop
-->
<style>
/* =====================================================================
   === STYLE: designer may restyle everything in this block ===
   All colours, fonts, sizes and timings live in :root below. RENDER
   reads the numeric ones (iso unit, particle sizes, phase timings) at
   runtime, so changing them here changes the show.
   ===================================================================== */
:root{
  /* --- Brand colours --- */
  --c-dark-ai:#303030;
  --c-bold-indigo:#2A288C;
  --c-qure-peach:#FF7869;
  --c-ambitious-lavender:#D9D9FF;
  --c-optimistic-yellow:#FFE9AE;

  /* --- Supporting tints --- */
  --c-white:#FFFFFF;
  --c-paper:#FCFCFF;
  --c-lavender-050:#F5F5FF;
  --c-lavender-300:#A9A8E8;
  --c-grey-500:#8A8A99;
  --c-grey-300:#C9C9D4;
  --c-grey-200:#E6E6F0;
  --c-peach-100:#FFE1DD;
  --c-peach-150:#FFD0C9;
  --c-peach-200:#FFBCB4;
  --c-peach-edge:#E0574A;

  /* --- Semantic roles (restyle these first) --- */
  --c-letterbox:#E9E9F1;
  --c-bg:var(--c-paper);
  --c-text:var(--c-dark-ai);
  --c-text-muted:var(--c-grey-500);
  --c-heading:var(--c-bold-indigo);
  --c-accent:var(--c-qure-peach);
  --c-line:var(--c-grey-200);
  --c-veil:rgba(252,252,255,.86);
  --c-floor:var(--c-lavender-050);
  --c-floor-grid:var(--c-ambitious-lavender);
  --c-box-top:var(--c-white);
  --c-box-left:#F4F4FA;
  --c-box-right:#E9E9F3;
  --c-box-edge:var(--c-dark-ai);
  --c-ward-left:#F0F0FA;
  --c-ward-right:#E3E3F1;
  --c-hero-top:var(--c-peach-100);
  --c-hero-left:var(--c-peach-150);
  --c-hero-right:var(--c-peach-200);
  --c-hero-edge:var(--c-peach-edge);
  --c-blueprint-line:var(--c-lavender-300);
  --c-blueprint-fill:rgba(217,217,255,.18);
  --c-connector:var(--c-dark-ai);
  --c-lane-qct:var(--c-qure-peach);
  --c-particle:var(--c-lavender-300);
  --c-particle-finding:var(--c-bold-indigo);
  --c-particle-ring:var(--c-dark-ai);
  --c-particle-qct:var(--c-qure-peach);
  --c-particle-lost:var(--c-dark-ai);
  --c-particle-closed:var(--c-bold-indigo);
  --c-sample-bg:var(--c-optimistic-yellow);
  --c-bar-without:var(--c-grey-300);
  --c-bar-with:var(--c-qure-peach);
  --c-intro-panel:var(--c-dark-ai);
  --c-intro-slice:var(--c-ambitious-lavender);
  --c-intro-slice-edge:var(--c-lavender-300);
  --c-intro-active:var(--c-bold-indigo);
  --c-intro-scan:var(--c-ambitious-lavender);
  --c-intro-finding:var(--c-qure-peach);
  --c-dev-bg:rgba(30,30,36,.94);
  --c-dev-text:#F2F2F8;

  /* --- Fonts --- */
  --f-heading:"Aether Neue","DM Sans",sans-serif;
  --f-number:"Aether Neue","DM Sans",sans-serif;
  --f-body:"DM Sans",sans-serif;
  --f-label:"DM Mono",ui-monospace,monospace;
  --fw-heading:400;
  --fw-number:400;
  --ls-heading:-.02em;
  --ls-overline:.08em;

  /* --- Canvas sizes --- */
  --wall-w:1920px;
  --wall-h:1080px;
  --tablet-w:1180px;
  --tablet-h:820px;

  /* --- Isometric geometry (unitless numbers are read by RENDER) --- */
  --iso-unit:50;              /* px per grid unit on the wall */
  --iso-unit-preview:24;      /* px per grid unit on tablet previews */
  --wall-scene-area:110 250 1700 760;   /* x y w h the hospital is centred in */
  --edge-w:1.5px;
  --connector-w:1.2px;
  --build-drop:44;            /* px a block falls while assembling */
  --particle-r:3.4;
  --particle-finding-r:5.6;
  --particle-ring-gap:3.2;
  --pulse-r:30;
  --particle-speed:4.6;       /* grid units per second */

  /* --- Wall layout & type --- */
  --wall-pad:72px;
  --wall-pad-top:56px;
  --fs-wall-hero:116px;
  --fs-wall-title:52px;
  --fs-wall-lead:28px;
  --fs-wall-spec:120px;
  --fs-wall-number:112px;
  --fs-wall-counter:60px;
  --fs-wall-label:17px;
  --fs-wall-small:16px;
  --fs-wall-assump:16px;
  --fs-node-over:12px;
  --fs-node-name:17px;
  --fs-particle-label:12px;
  --fs-intro-label:15px;
  --w-counter:250px;
  --scene-attract:translate(330px,40px) scale(.86);
  --scene-attract-opacity:.5;
  --scene-inputs:translate(340px,30px) scale(.9);

  /* --- Tablet layout & type --- */
  --tab-pad:56px;
  --tab-header-h:72px;
  --fs-tab-hero:68px;
  --fs-tab-title:44px;
  --fs-tab-lead:20px;
  --fs-tab-number:46px;
  --fs-tab-body:17px;
  --fs-tab-label:13px;
  --fs-tab-button:19px;
  --fs-overline:13px;
  --fs-sample:11px;
  --fs-pill:13px;
  --btn-h:60px;
  --btn-pad:34px;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;

  /* --- Timing: phase lengths (RENDER reads these; total ≈ 90s) --- */
  --t-build:10s;
  --t-year-title:2.2s;
  --t-month:2.5s;             /* ×12 per year */
  --t-outcome:15.6s;
  /* build choreography, as fractions of --t-build */
  --build-floor-end:.12;
  --build-boxes-start:.1;
  --build-boxes-end:.6;
  --build-box-dur:.07;
  --build-connectors-start:.6;
  --build-labels-start:.74;
  --build-facts-start:.3;
  /* particles */
  --t-lead:1.6s;
  --t-dwell-scan:.45s;
  --t-dwell-read:.6s;
  --t-dwell-desk:1s;
  --t-dwell-clinic:.7s;
  --t-drift:1.7s;
  --t-pulse:1.2s;
  /* outcome */
  --t-countup:2.4s;
  --t-countup-stagger:.35s;
  /* intro */
  --t-scan-sweep:1.8s;
  /* UI */
  --t-ui:.35s;
  --t-screen:.6s;
  --t-scene:1.2s;
  --t-qct-switch:1.2s;
  --ease-io:cubic-bezier(.65,0,.35,1);
  --ease-out:cubic-bezier(.33,1,.68,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--c-letterbox);color:var(--c-text);font-family:var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
em{font-style:normal;color:var(--c-accent)}
.overline{font-family:var(--f-label);font-size:var(--fs-overline);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--c-text-muted)}
.mono{font-family:var(--f-label)}
.num{font-family:var(--f-number);font-weight:var(--fw-number);font-variant-numeric:tabular-nums}
.sample{display:inline-block;font-family:var(--f-label);font-size:var(--fs-sample);letter-spacing:.1em;line-height:1;padding:.45em .7em;border-radius:999px;background:var(--c-sample-bg);color:var(--c-text)}
.pill{display:inline-flex;align-items:center;gap:.6em;padding:.5em 1em;border:1px solid var(--c-line);border-radius:999px;background:var(--c-white);font-family:var(--f-label);font-size:var(--fs-pill);letter-spacing:.06em;text-transform:uppercase;color:var(--c-text)}
.pill .dot{width:.6em;height:.6em;border-radius:50%;background:var(--c-heading);transition:background var(--t-ui)}
.pill.is-found .dot{background:var(--c-accent)}

/* --- Buttons --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;height:var(--btn-h);padding:0 var(--btn-pad);border-radius:999px;font-family:var(--f-body);font-weight:500;font-size:var(--fs-tab-button);text-decoration:none;transition:background var(--t-ui) var(--ease-io),color var(--t-ui),opacity var(--t-ui),transform var(--t-ui)}
.btn-primary{background:var(--c-heading);color:var(--c-white)}
.btn-primary:active{transform:scale(.98)}
.btn-primary[disabled]{opacity:.3;cursor:default}
.btn-secondary{background:var(--c-white);color:var(--c-heading);border:1.5px solid var(--c-heading)}
.btn-ghost{color:var(--c-heading);height:auto;padding:0;text-decoration:underline;text-underline-offset:4px}

/* --- Viewport + scaled stage --- */
.viewport{position:fixed;inset:0;overflow:hidden;background:var(--c-letterbox)}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--c-bg)}
.wall{width:var(--wall-w);height:var(--wall-h)}
.tablet{width:var(--tablet-w);height:var(--tablet-h)}

/* --- Isometric hospital (shared by wall + tablet previews) --- */
.hospital .floor-plate{fill:var(--c-floor)}
.hospital .floor-grid{fill:none;stroke:var(--c-floor-grid);stroke-width:1px}
.hospital .connector{fill:none;stroke:var(--c-connector);stroke-width:var(--connector-w);stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.hospital .lane-qct{fill:none;stroke:var(--c-lane-qct);stroke-width:2px;stroke-linecap:round;stroke-dasharray:1 7;opacity:0;transition:opacity var(--t-qct-switch) var(--ease-io)}
.hospital .face{stroke:var(--c-box-edge);stroke-width:var(--edge-w);stroke-linejoin:round;transition:fill var(--t-qct-switch) var(--ease-io),stroke var(--t-qct-switch) var(--ease-io)}
.hospital .face-top{fill:var(--c-box-top)}
.hospital .face-left{fill:var(--c-box-left)}
.hospital .face-right{fill:var(--c-box-right)}
.hospital .ward .face-left{fill:var(--c-ward-left)}
.hospital .ward .face-right{fill:var(--c-ward-right)}
.hospital .face-inner{fill:none;stroke:var(--c-box-edge);stroke-width:1px;opacity:.12}
.hospital .glyph{fill:none;stroke:var(--c-box-edge);stroke-width:1.3px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:stroke var(--t-qct-switch)}
.hospital.qct-on .is-qct .face-top{fill:var(--c-hero-top);stroke:var(--c-hero-edge)}
.hospital.qct-on .is-qct .face-left{fill:var(--c-hero-left);stroke:var(--c-hero-edge)}
.hospital.qct-on .is-qct .face-right{fill:var(--c-hero-right);stroke:var(--c-hero-edge)}
.hospital.qct-on .is-qct .face-inner{stroke:var(--c-hero-edge);opacity:.35}
.hospital.qct-on .is-qct .glyph{stroke:var(--c-hero-edge)}
.hospital.qct-on .lane-qct{opacity:.9}
.hospital.blueprint .face{fill:var(--c-blueprint-fill);stroke:var(--c-blueprint-line);stroke-dasharray:4 4}
.hospital.blueprint .glyph,.hospital.blueprint .face-inner{stroke:var(--c-blueprint-line)}
.hospital.blueprint .connector{stroke:var(--c-blueprint-line);stroke-dasharray:3 5;opacity:1}

/* --- Node labels (HTML, positioned by RENDER) --- */
.node-labels{position:absolute;inset:0;pointer-events:none;transition:opacity var(--t-screen) var(--ease-io)}
.node-label{position:absolute;width:0;height:0}
.nl-text{position:absolute;left:0;bottom:calc(var(--lift) + 8px);transform:translateX(-50%);text-align:center;white-space:nowrap}
.nl-over{font-family:var(--f-label);font-size:var(--fs-node-over);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--c-text-muted)}
.nl-name{font-family:var(--f-body);font-size:var(--fs-node-name);color:var(--c-text);margin-top:2px}
.nl-qct{display:inline-block;margin-top:5px;font-family:var(--f-label);font-size:11px;letter-spacing:.08em;color:var(--c-white);background:var(--c-accent);border-radius:999px;padding:3px 8px;opacity:0;transform:translateY(4px);transition:opacity var(--t-qct-switch),transform var(--t-qct-switch) var(--ease-out)}
.node-labels.qct-on .nl-qct{opacity:1;transform:none}
.nl-leader{position:absolute;left:-.5px;bottom:0;width:1px;height:var(--lift);background:var(--c-grey-300)}
.nl-dot{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--c-dark-ai)}

/* --- Wall layers: visible per data-phase --- */
.wall .layer{position:absolute;opacity:0;visibility:hidden;transition:opacity var(--t-screen) var(--ease-io),visibility 0s linear var(--t-screen)}
.wall[data-phase="attract"] .on-attract,
.wall[data-phase="intro"] .on-intro,
.wall[data-phase="inputs"] .on-inputs,
.wall[data-phase="build"] .on-build,
.wall[data-phase="without"] .on-without,
.wall[data-phase="with"] .on-with,
.wall[data-phase="outcome"] .on-outcome,
.wall .layer.show{opacity:1;visibility:visible;transition-delay:0s}

.scene{position:absolute;inset:0;transform-origin:50% 50%;transition:transform var(--t-scene) var(--ease-io),opacity var(--t-screen) var(--ease-io)}
.scene>svg,.scene>canvas{position:absolute;left:0;top:0;width:var(--wall-w);height:var(--wall-h)}
.wall[data-phase="attract"] .scene{transform:var(--scene-attract);opacity:var(--scene-attract-opacity)}
.wall[data-phase="inputs"] .scene{transform:var(--scene-inputs)}
.wall[data-phase="intro"] .scene,.wall[data-phase="outcome"] .scene{opacity:0}
.wall[data-phase="attract"] .node-labels,.wall[data-phase="inputs"] .node-labels{opacity:0}

.w-title{font-family:var(--f-heading);font-weight:var(--fw-heading);letter-spacing:var(--ls-heading);font-size:var(--fs-wall-title);line-height:1.04;color:var(--c-heading)}
.w-lead{font-size:var(--fs-wall-lead);line-height:1.35;color:var(--c-text)}
.wall .overline{font-size:var(--fs-wall-label)}

/* attract */
.w-attract{left:var(--wall-pad);top:200px;width:820px}
.w-hero{font-family:var(--f-heading);font-weight:var(--fw-heading);letter-spacing:var(--ls-heading);font-size:var(--fs-wall-hero);line-height:.98;color:var(--c-heading);margin:24px 0 36px}
.w-attract .w-lead{max-width:640px}
.w-attract .pill{margin-top:44px}

/* inputs */
.w-inputs{left:var(--wall-pad);top:170px;width:760px}
.w-specs{margin-top:36px;display:grid;gap:30px}
.w-specs dt{font-family:var(--f-label);font-size:var(--fs-wall-label);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--c-text-muted)}
.w-specs dd{font-family:var(--f-number);font-weight:var(--fw-number);font-size:var(--fs-wall-spec);line-height:1;color:var(--c-heading);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.w-specs dd small{font-family:var(--f-label);font-size:var(--fs-wall-label);letter-spacing:.06em;color:var(--c-text-muted);margin-left:14px;text-transform:uppercase}
.w-specs .is-region{font-size:calc(var(--fs-wall-spec) * .55)}

/* intro */
.w-intro{inset:0}
.w-intro canvas{position:absolute;left:0;top:0;width:var(--wall-w);height:var(--wall-h)}
.w-intro-copy{position:absolute;left:var(--wall-pad);top:var(--wall-pad-top);width:900px}
.w-intro-copy .w-title{margin:14px 0 14px}
.w-intro-status{position:absolute;left:1100px;top:196px}
.w-intro-note{position:absolute;left:var(--wall-pad);bottom:44px;font-size:var(--fs-wall-small);color:var(--c-text-muted);letter-spacing:.04em}

/* build headline */
.w-buildhead{left:var(--wall-pad);top:var(--wall-pad-top);width:1200px}
.w-buildhead .w-title{margin-top:12px}
.w-build-facts{list-style:none;display:flex;gap:36px;margin-top:20px;font-family:var(--f-label);font-size:var(--fs-wall-label);letter-spacing:.04em;text-transform:uppercase}
.w-build-facts li{opacity:0;transform:translateY(8px);transition:opacity var(--t-screen) var(--ease-out),transform var(--t-screen) var(--ease-out)}
.w-build-facts li.show{opacity:1;transform:none}
.w-build-facts li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c-heading);margin-right:10px;vertical-align:middle}

/* year top bar */
.w-topbar{left:var(--wall-pad);right:var(--wall-pad);top:var(--wall-pad-top);display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:72px;align-items:start}
.w-topbar>div:first-child{grid-column:1;grid-row:1}
.w-counters{grid-column:2;grid-row:1 / span 2}
.w-topbar .w-title{font-size:calc(var(--fs-wall-title) * .84);margin-top:10px}
.w-ticker{grid-column:1;grid-row:2;padding-top:30px}
.w-ticker-track{position:relative;height:2px;background:var(--c-grey-200)}
.w-ticker-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c-heading)}
.w-ticker-head{position:absolute;top:50%;left:0;width:16px;height:16px;border-radius:50%;background:var(--c-white);border:2px solid var(--c-heading);transform:translate(-50%,-50%)}
.w-ticker-months{list-style:none;display:grid;grid-template-columns:repeat(12,1fr);margin-top:16px;font-family:var(--f-label);font-size:var(--fs-wall-small);letter-spacing:.06em;text-transform:uppercase;color:var(--c-grey-300);text-align:center}
.w-ticker-months li{transition:color var(--t-ui)}
.w-ticker-months li.is-past{color:var(--c-text-muted)}
.w-ticker-months li.is-current{color:var(--c-heading)}
.w-counters{display:flex;gap:36px}
.w-counter{width:var(--w-counter)}
.w-counter .c-label{font-family:var(--f-label);font-size:var(--fs-wall-small);letter-spacing:.06em;text-transform:uppercase;color:var(--c-text)}
.w-counter .c-value{font-family:var(--f-number);font-weight:var(--fw-number);font-size:var(--fs-wall-counter);line-height:1.08;margin-top:6px;color:var(--c-dark-ai);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.w-counter .c-value small{font-size:.4em;letter-spacing:0;margin-left:6px;color:var(--c-text-muted)}
.wall[data-phase="with"] .w-counter .c-value{color:var(--c-heading)}
.w-counter .c-sub{font-size:var(--fs-wall-small);color:var(--c-text-muted)}
.w-counter .c-vs{font-family:var(--f-label);font-size:14px;letter-spacing:.04em;color:var(--c-accent);min-height:1.4em;margin-top:4px}

.w-yearcard{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--c-veil);text-align:center}
.w-yearcard .w-title{font-size:calc(var(--fs-wall-title) * 1.6)}

.w-legend{left:var(--wall-pad);bottom:40px;display:flex;gap:34px;font-family:var(--f-label);font-size:14px;letter-spacing:.03em;color:var(--c-text)}
.w-legend span{display:inline-flex;align-items:center;gap:9px}
.w-legend svg{overflow:visible}
.w-legend .lg-qct{transition:opacity var(--t-ui)}
.wall[data-phase="without"] .w-legend .lg-qct{opacity:.25}
.w-sample-tag{right:var(--wall-pad);bottom:40px;display:flex;align-items:center;gap:12px;font-family:var(--f-label);font-size:14px;color:var(--c-text-muted)}

/* outcome */
.w-outcome{inset:0;padding:var(--wall-pad-top) var(--wall-pad) 40px;display:flex;flex-direction:column}
.w-outcome .w-title{font-size:calc(var(--fs-wall-title) * 1.1);margin-top:12px}
.w-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;margin-top:44px}
.w-metric{border-top:2px solid var(--c-heading);padding-top:18px}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.m-label{font-family:var(--f-label);font-size:var(--fs-wall-label);letter-spacing:.06em;text-transform:uppercase}
.m-value{font-family:var(--f-number);font-weight:var(--fw-number);font-size:var(--fs-wall-number);line-height:1;margin:22px 0 22px;color:var(--c-heading);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.m-bars{display:grid;gap:8px}
.m-bar{display:grid;grid-template-columns:118px 1fr 92px;align-items:center;gap:12px;font-family:var(--f-label);font-size:14px;color:var(--c-text-muted)}
.m-bar i{display:block;height:8px;border-radius:4px;background:var(--c-bar-without);transform-origin:left center}
.m-bar.is-with i{background:var(--c-bar-with)}
.m-bar b{font-weight:500;color:var(--c-text);text-align:right;font-variant-numeric:tabular-nums}
.m-delta{margin-top:14px;font-size:19px;color:var(--c-text)}
.w-assumptions{margin-top:auto;border-top:1px solid var(--c-line);padding-top:20px}
.w-assumptions h3{font-family:var(--f-label);font-weight:400;font-size:var(--fs-wall-small);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--c-text-muted);margin-bottom:10px}
.w-assumptions .assump-list{columns:2;column-gap:72px;font-size:var(--fs-wall-assump)}
.w-assumptions .disclaimer{margin-top:12px;font-family:var(--f-label);font-size:14px;color:var(--c-text-muted)}

.assump-list{list-style:none;font-family:var(--f-label)}
.assump-list li{display:flex;gap:12px;align-items:baseline;break-inside:avoid;padding:5px 0;border-bottom:1px dashed var(--c-grey-200)}
.assump-list .a-label{flex:1;color:var(--c-text)}
.assump-list .a-value{color:var(--c-heading);font-weight:500;white-space:nowrap}
.assump-list .a-tag{font-size:.7em;letter-spacing:.08em;color:var(--c-accent);white-space:nowrap}
.assump-list .is-note .a-label{color:var(--c-text-muted)}
.assump-list .is-note .a-tag{color:var(--c-text-muted)}

/* --- Tablet --- */
.tablet .t-header{position:absolute;left:0;right:0;top:0;height:var(--tab-header-h);padding:0 var(--tab-pad);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--c-line)}
.t-brand{font-family:var(--f-heading);font-size:22px;color:var(--c-heading);letter-spacing:-.01em}
.t-screen{position:absolute;left:0;right:0;top:var(--tab-header-h);bottom:0;padding:var(--tab-pad);opacity:0;visibility:hidden;transition:opacity var(--t-screen) var(--ease-io),visibility 0s linear var(--t-screen)}
.tablet[data-screen="welcome"] .t-welcome,
.tablet[data-screen="intro"] .t-intro,
.tablet[data-screen="inputs"] .t-inputs,
.tablet[data-screen="playing"] .t-playing,
.tablet[data-screen="results"] .t-results{opacity:1;visibility:visible;transition-delay:0s}
.t-hero{font-family:var(--f-heading);font-weight:var(--fw-heading);letter-spacing:var(--ls-heading);font-size:var(--fs-tab-hero);line-height:1;color:var(--c-heading);margin:18px 0 26px}
.t-title{font-family:var(--f-heading);font-weight:var(--fw-heading);letter-spacing:var(--ls-heading);font-size:var(--fs-tab-title);line-height:1.05;color:var(--c-heading);margin:12px 0 16px}
.t-lead{font-size:var(--fs-tab-lead);line-height:1.45;max-width:520px}
.t-body{font-size:var(--fs-tab-body);line-height:1.5;color:var(--c-text)}
.t-welcome{display:grid;grid-template-columns:1fr 470px;gap:24px;align-items:center}
.t-welcome .btn{margin-top:40px;min-width:220px}
.t-art{width:470px;height:520px}

.t-intro{display:grid;grid-template-columns:1fr 300px;gap:56px}
.t-intro-status{margin-top:28px;display:flex;align-items:center;gap:12px;font-size:var(--fs-tab-body);min-height:30px}
.t-intro-status i{width:10px;height:10px;border-radius:50%;background:var(--c-grey-300);transition:background var(--t-ui)}
.t-intro-status.is-reading i{background:var(--c-heading)}
.t-intro-status.is-found i{background:var(--c-accent)}
.t-intro-actions{display:flex;align-items:center;gap:28px;margin-top:40px}
.t-slicer{display:flex;flex-direction:column;align-items:center;gap:16px}
.t-slicer-track{position:relative;width:132px;height:560px;border-radius:var(--radius-l);background:var(--c-lavender-050);border:1.5px solid var(--c-ambitious-lavender);touch-action:none;cursor:grab;overflow:hidden}
.t-slicer-lines{position:absolute;inset:16px 22px;background:repeating-linear-gradient(to bottom,var(--c-ambitious-lavender) 0 1px,transparent 1px 22px)}
.t-slicer-fill{position:absolute;left:0;right:0;top:0;background:rgba(42,40,140,.08)}
.t-slicer-handle{position:absolute;left:10px;right:10px;height:60px;border-radius:var(--radius-m);background:var(--c-white);border:2px solid var(--c-heading);box-shadow:0 6px 18px rgba(42,40,140,.16);display:flex;align-items:center;justify-content:center;gap:5px}
.t-slicer-handle span{width:30px;height:2px;background:var(--c-heading);box-shadow:0 -6px 0 var(--c-heading),0 6px 0 var(--c-heading)}
.t-slicer-readout{font-size:var(--fs-tab-label);letter-spacing:.08em;color:var(--c-text-muted)}

.t-inputs{display:grid;grid-template-columns:1fr 470px;gap:40px}
.t-form .field{margin-top:26px}
.field-head{display:flex;justify-content:space-between;align-items:baseline}
.field-label{font-family:var(--f-label);font-size:var(--fs-tab-label);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--c-text-muted)}
.field-value{font-family:var(--f-number);font-size:var(--fs-tab-number);color:var(--c-heading);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.field-value small{font-family:var(--f-label);font-size:12px;letter-spacing:.06em;color:var(--c-text-muted);margin-left:8px;text-transform:uppercase}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:pointer;--fill:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--c-heading) var(--fill),var(--c-grey-200) var(--fill))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-15px;border-radius:50%;background:var(--c-white);border:2px solid var(--c-heading);box-shadow:0 3px 10px rgba(42,40,140,.18)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--c-grey-200)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--c-heading)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--c-white);border:2px solid var(--c-heading)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.seg button{height:58px;border:1.5px solid var(--c-grey-300);border-radius:var(--radius-m);font-size:16px;color:var(--c-text);background:var(--c-white);transition:border-color var(--t-ui),background var(--t-ui),color var(--t-ui)}
.seg button[aria-checked="true"]{border-color:var(--c-heading);background:var(--c-ambitious-lavender);color:var(--c-heading)}
.t-note{margin-top:22px;font-size:14px;color:var(--c-text-muted)}
.t-form .btn{margin-top:26px;min-width:260px}
.t-preview{border:1px solid var(--c-line);border-radius:var(--radius-l);background:var(--c-white);display:flex;flex-direction:column;overflow:hidden}
.t-preview svg{width:100%;flex:1}
.t-preview-caption{padding:14px 20px;border-top:1px solid var(--c-line);font-size:var(--fs-tab-label);letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted)}

.t-playing{display:flex;flex-direction:column}
.t-steps{list-style:none;margin-top:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.t-steps li{border-top:3px solid var(--c-grey-200);padding-top:14px;font-size:var(--fs-tab-body);color:var(--c-text-muted);transition:border-color var(--t-ui),color var(--t-ui)}
.t-steps li .mono{display:block;font-size:12px;letter-spacing:.08em;margin-bottom:6px}
.t-steps li.is-done{border-color:var(--c-lavender-300);color:var(--c-text)}
.t-steps li.is-active{border-color:var(--c-accent);color:var(--c-heading)}
.t-progress{margin-top:56px;height:6px;border-radius:3px;background:var(--c-grey-200);overflow:hidden}
.t-progress-fill{height:100%;width:0;background:var(--c-heading)}
.t-progress-meta{display:flex;justify-content:space-between;margin-top:14px;font-size:var(--fs-tab-label);letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted)}
.t-playing .btn{margin-top:auto;align-self:flex-start;min-width:240px}

.t-results{display:grid;grid-template-columns:1fr 440px;gap:32px;padding-top:32px;padding-bottom:32px}
.t-results-main{display:flex;flex-direction:column;min-width:0}
.t-results .t-title{font-size:36px;margin-bottom:20px}
.t-metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.t-metric{border:1px solid var(--c-line);border-radius:var(--radius-m);padding:14px 18px;background:var(--c-white)}
.t-metric .m-head .m-label{font-size:12px}
.t-metric .m-value{font-size:var(--fs-tab-number);margin:10px 0 4px}
.t-metric .m-sub{font-size:14px;color:var(--c-text-muted)}
.t-share{display:grid;grid-template-columns:1fr 132px;gap:18px;align-items:center;margin-top:18px;border:1px solid var(--c-line);border-radius:var(--radius-m);padding:16px 18px;background:var(--c-white)}
.t-share form{display:flex;gap:10px;margin-top:10px}
.t-share input{flex:1;min-width:0;height:48px;border:1.5px solid var(--c-grey-300);border-radius:var(--radius-s);padding:0 14px;font-size:16px;color:var(--c-text);background:var(--c-white)}
.t-share .btn{height:48px;padding:0 22px;font-size:16px}
.t-share .t-note{margin-top:8px;font-size:12px;font-family:var(--f-label)}
.t-qr{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-label);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted);text-align:center}
.t-results-main .btn-secondary{margin-top:auto;align-self:flex-start;height:52px}
.t-assumptions{border:1px solid var(--c-line);border-radius:var(--radius-m);background:var(--c-white);padding:18px 20px;display:flex;flex-direction:column;min-height:0}
.t-assumptions h3{font-family:var(--f-label);font-weight:500;font-size:var(--fs-tab-label);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--c-heading);margin-bottom:8px}
.t-assumptions .assump-list{font-size:11px;line-height:1.3;overflow:auto;min-height:0}
.t-assumptions .assump-list li{padding:3.5px 0}
.t-assumptions .disclaimer{margin-top:10px;font-size:12px;line-height:1.45;color:var(--c-text-muted)}

/* --- Launcher + preview (dev only) --- */
.launcher{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--c-bg)}
.launcher-card{max-width:760px;padding:48px}
.launcher h1{font-family:var(--f-heading);font-weight:var(--fw-heading);letter-spacing:var(--ls-heading);font-size:64px;line-height:1;color:var(--c-heading);margin:16px 0 20px}
.launcher p{font-size:18px;line-height:1.5}
.launcher-actions{display:flex;flex-wrap:wrap;gap:14px;margin:32px 0 22px}
.launcher-actions .btn{font-size:17px;height:54px}
.preview{position:fixed;inset:0;display:grid;grid-template-columns:38fr 62fr;gap:16px;padding:16px;background:var(--c-letterbox)}
.preview figure{display:flex;flex-direction:column;gap:8px;min-width:0}
.preview figcaption{font-family:var(--f-label);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted)}
.preview iframe{flex:1;width:100%;border:0;border-radius:8px;background:var(--c-white)}

/* --- Dev panel --- */
.dev{position:fixed;right:12px;top:12px;z-index:100;width:340px;max-height:calc(100vh - 24px);overflow:auto;padding:14px 16px;border-radius:12px;background:var(--c-dev-bg);color:var(--c-dev-text);font-family:var(--f-label);font-size:12px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.dev-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase}
.dev-row{margin-top:10px}
.dev-row>label,.dev-row>.dev-k{display:flex;justify-content:space-between;opacity:.75;margin-bottom:4px}
.dev-btns{display:flex;flex-wrap:wrap;gap:5px}
.dev button{padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.25);color:inherit}
.dev button.is-on{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-dark-ai)}
.dev input[type=range]{height:22px}
.dev input[type=range]::-webkit-slider-runnable-track{background:rgba(255,255,255,.25)}
.dev input[type=range]::-webkit-slider-thumb{width:16px;height:16px;margin-top:-6px}
.dev select{width:100%;padding:4px;border-radius:6px;background:transparent;color:inherit;border:1px solid rgba(255,255,255,.25);font:inherit}
.dev select option{color:#000}
.dev pre{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.15);white-space:pre-wrap;opacity:.85;font:inherit}
</style>
</head>
<body>
<!-- =====================================================================
     === MARKUP: structure only; text comes from CONFIG.copy (data-copy) ===
     ===================================================================== -->

<div id="launcher" class="launcher" hidden>
  <div class="launcher-card">
    <div class="overline"><span data-copy="brand"></span> · <span data-copy="event"></span></div>
    <h1 data-copy="title"></h1>
    <p>Open the two views in separate windows. They stay in sync through BroadcastChannel on this machine.</p>
    <div class="launcher-actions">
      <a class="btn btn-primary" href="#tablet" target="qct-tablet">Open tablet · 1180×820</a>
      <a class="btn btn-primary" href="#wall" target="qct-wall">Open wall · 1920×1080</a>
      <a class="btn btn-secondary" href="#preview">Side-by-side preview</a>
    </div>
    <p class="overline">Press D in either view for the dev panel</p>
  </div>
</div>

<div id="preview" class="preview" hidden>
  <figure><figcaption>Tablet · #tablet</figcaption><iframe title="Tablet view" data-view="tablet"></iframe></figure>
  <figure><figcaption>Wall · #wall</figcaption><iframe title="Wall view" data-view="wall"></iframe></figure>
</div>

<!-- WALL · 1920×1080 -->
<div id="wall-root" class="viewport" hidden>
  <div id="wall" class="stage wall" data-phase="attract">
    <div class="scene">
      <svg class="hospital" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      <canvas class="particles" aria-hidden="true"></canvas>
      <div class="node-labels"></div>
    </div>

    <section class="layer on-attract w-attract">
      <div class="overline" data-copy="wallAttractOverline"></div>
      <h1 class="w-hero" data-copy="title"></h1>
      <p class="w-lead" data-copy="wallAttractSub"></p>
      <div class="pill"><span class="dot"></span><span data-copy="wallAttractPill"></span></div>
    </section>

    <section class="layer on-inputs w-inputs">
      <div class="overline" data-copy="wallInputsOverline"></div>
      <h2 class="w-title" data-copy="wallInputsTitle"></h2>
      <dl class="w-specs">
        <div><dt data-copy="bedsLabel"></dt><dd><span data-bind="beds"></span><small data-copy="bedsUnit"></small></dd></div>
        <div><dt data-copy="ctLabel"></dt><dd><span data-bind="ctVolume"></span><small data-copy="ctUnit"></small></dd></div>
        <div><dt data-copy="regionLabel"></dt><dd class="is-region" data-bind="region"></dd></div>
      </dl>
    </section>

    <section class="layer on-intro w-intro">
      <canvas class="intro-canvas" aria-hidden="true"></canvas>
      <div class="w-intro-copy">
        <div class="overline" data-copy="introOverline"></div>
        <h2 class="w-title" data-copy="introWallTitle"></h2>
        <p class="w-lead" data-copy="introWallBody"></p>
      </div>
      <div class="pill w-intro-status"><span class="dot"></span><span data-bind="introPill"></span></div>
      <div class="w-intro-note" data-copy="introNote"></div>
    </section>

    <section class="layer on-build w-buildhead">
      <div class="overline" data-copy="buildOverline"></div>
      <h2 class="w-title" data-copy="buildTitle"></h2>
      <ul class="w-build-facts"></ul>
    </section>

    <header class="layer on-without on-with w-topbar">
      <div>
        <div class="overline" data-bind="yearOverline"></div>
        <h2 class="w-title" data-bind="yearTitle"></h2>
      </div>
      <div class="w-ticker">
        <div class="w-ticker-track"><div class="w-ticker-fill"></div><div class="w-ticker-head"></div></div>
        <ol class="w-ticker-months"></ol>
      </div>
      <div class="w-counters">
        <div class="w-counter" data-counter="missed"><div class="c-label"></div><div class="c-value num">0</div><div class="c-sub"></div><div class="c-vs"></div></div>
        <div class="w-counter" data-counter="lost"><div class="c-label"></div><div class="c-value num">0</div><div class="c-sub"></div><div class="c-vs"></div></div>
        <div class="w-counter" data-counter="turnaround"><div class="c-label"></div><div class="c-value num">0</div><div class="c-sub"></div><div class="c-vs"></div></div>
      </div>
    </header>

    <footer class="layer on-without on-with w-legend"></footer>
    <div class="layer on-without on-with on-build w-sample-tag"><span class="sample" data-copy="sample"></span><span data-copy="sampleNote"></span></div>

    <div class="layer w-yearcard">
      <div class="overline" data-bind="cardOverline"></div>
      <div class="w-title" data-bind="cardTitle"></div>
    </div>

    <section class="layer on-outcome w-outcome">
      <div class="overline" data-bind="outcomeOverline"></div>
      <h2 class="w-title" data-copy="outcomeTitle"></h2>
      <div class="w-metrics"></div>
      <div class="w-assumptions">
        <h3 data-copy="assumptionsWallTitle"></h3>
        <ol class="assump-list"></ol>
        <p class="disclaimer" data-copy="disclaimer"></p>
      </div>
    </section>
  </div>
</div>

<!-- TABLET · 1180×820 -->
<div id="tablet-root" class="viewport" hidden>
  <div id="tablet" class="stage tablet" data-screen="welcome">
    <header class="t-header">
      <span class="t-brand" data-copy="brand"></span>
      <span class="overline" data-copy="event"></span>
    </header>

    <section class="t-screen t-welcome">
      <div>
        <div class="overline" data-copy="welcomeOverline"></div>
        <h1 class="t-hero" data-copy="title"></h1>
        <p class="t-lead" data-copy="welcomeLead"></p>
        <button class="btn btn-primary" data-action="start" data-copy="welcomeCta"></button>
      </div>
      <svg class="hospital t-art qct-on" viewBox="0 0 470 520" aria-hidden="true"></svg>
    </section>

    <section class="t-screen t-intro">
      <div>
        <div class="overline" data-copy="introOverline"></div>
        <h2 class="t-title" data-copy="introTitle"></h2>
        <p class="t-lead" data-copy="introBody"></p>
        <div class="t-intro-status"><i></i><span data-bind="introStatus"></span></div>
        <div class="t-intro-actions">
          <button class="btn btn-primary" data-action="intro-continue" data-copy="introContinue" disabled></button>
          <button class="btn btn-ghost" data-action="intro-skip" data-copy="introSkip"></button>
        </div>
      </div>
      <div class="t-slicer">
        <div class="t-slicer-track"><div class="t-slicer-lines"></div><div class="t-slicer-fill"></div><div class="t-slicer-handle"><span></span></div></div>
        <div class="t-slicer-readout" data-bind="sliceReadout"></div>
      </div>
    </section>

    <section class="t-screen t-inputs">
      <div class="t-form">
        <div class="overline" data-copy="inputsOverline"></div>
        <h2 class="t-title" data-copy="inputsTitle"></h2>
        <div class="field">
          <div class="field-head"><label class="field-label" for="in-beds" data-copy="bedsLabel"></label><div class="field-value"><span data-bind="beds"></span><small data-copy="bedsUnit"></small></div></div>
          <input type="range" id="in-beds" data-input="beds">
        </div>
        <div class="field">
          <div class="field-head"><label class="field-label" for="in-ct" data-copy="ctLabel"></label><div class="field-value"><span data-bind="ctVolume"></span><small data-copy="ctUnit"></small></div></div>
          <input type="range" id="in-ct" data-input="ctVolume">
        </div>
        <div class="field">
          <div class="field-label" data-copy="regionLabel"></div>
          <div class="seg" role="radiogroup"></div>
        </div>
        <p class="t-note" data-copy="inputsNote"></p>
        <button class="btn btn-primary" data-action="build" data-copy="buildCta"></button>
      </div>
      <div class="t-preview">
        <svg class="hospital" viewBox="0 0 470 520" aria-hidden="true"></svg>
        <div class="t-preview-caption" data-bind="facilityCaption"></div>
      </div>
    </section>

    <section class="t-screen t-playing">
      <div class="overline" data-copy="playingOverline"></div>
      <h2 class="t-title" data-bind="phaseName"></h2>
      <p class="t-body" data-copy="playingBody"></p>
      <ol class="t-steps"></ol>
      <div class="t-progress"><div class="t-progress-fill"></div></div>
      <div class="t-progress-meta"><span data-bind="playMonth"></span><span data-bind="playRemaining"></span></div>
      <button class="btn btn-secondary" data-action="skip" data-copy="skipCta"></button>
    </section>

    <section class="t-screen t-results">
      <div class="t-results-main">
        <div class="overline" data-bind="resultsOverline"></div>
        <h2 class="t-title" data-copy="outcomeTitle"></h2>
        <div class="t-metrics"></div>
        <div class="t-share">
          <div>
            <label class="field-label" for="in-email" data-copy="emailLabel"></label>
            <form data-action="email">
              <input id="in-email" type="email" autocomplete="off" data-copy-placeholder="emailPlaceholder">
              <button class="btn btn-primary" type="submit" data-copy="emailCta"></button>
            </form>
            <p class="t-note" data-bind="emailNote"></p>
          </div>

/* =====================================================================
   === ENGINE: do not restyle ===
   Pure and deterministic: (inputs, CONFIG) → monthly results for both
   scenarios. Never reads or writes the DOM, the clock or Math.random.
   ===================================================================== */
const ENGINE = (() => {
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const round1 = v => Math.round(v * 10) / 10;
  const normalise = arr => { const s = arr.reduce((a, b) => a + b, 0); return arr.map(v => v / s); };

  const fmt = {
    int: v => Math.round(v).toLocaleString('en-US'),
    pct: v => { const p = v * 100; return (Number.isInteger(Math.round(p * 10) / 10) ? p.toFixed(0) : p.toFixed(1)) + '%'; },
    usd: v => '$' + Math.round(v).toLocaleString('en-US'),
    usdCompact: v => {
      const a = Math.abs(v), s = v < 0 ? '−$' : '$';
      if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
      if (a >= 1e3) return s + Math.round(a / 1e3) + 'K';
      return s + Math.round(a);
    },
    mult: v => '×' + v.toFixed(2),
    days: v => Math.round(v) + ' days',
    months: v => v + (v === 1 ? ' month' : ' months'),
    ratio: v => v.toFixed(2),
    profile: () => '12-month curve'
  };

  function sanitiseInputs(raw, cfg) {
    const I = cfg.inputs, r = raw || {};
    const snap = (v, s) => {
      const n = Number.isFinite(+v) && v !== null && v !== '' ? +v : s.default;
      return clamp(Math.round(n / s.step) * s.step, s.min, s.max);
    };
    return {
      beds: snap(r.beds, I.beds),
      ctVolume: snap(r.ctVolume, I.ctVolume),
      region: cfg.regions[r.region] ? r.region : I.region.default
    };
  }

  function facility(inputs, cfg) {
    const F = cfg.facility;
    const fp = inputs.beds < F.footprintSteps[0] ? 0 : inputs.beds < F.footprintSteps[1] ? 1 : 2;
    return {
      scanners: clamp(Math.ceil(inputs.ctVolume / F.scansPerScanner), 1, F.maxScanners),
      clinics: clamp(Math.round(inputs.beds / F.bedsPerClinic) + 1, F.minClinics, F.maxClinics),
      wardFloors: clamp(Math.round(inputs.beds / F.bedsPerWardFloor), F.minFloors, F.maxFloors),
      wardFootprint: F.footprints[fp]
    };
  }

  // One scenario, month by month. Counts are rounded on the running total
  // so monthly rows always add up to the annual figure.
  function scenario(inputs, cfg, withQCT) {
    const A = cfg.assumptions, R = cfg.regions[inputs.region];
    const w = normalise(A.seasonality.value);
    const keys = ['scans', 'findings', 'missed', 'completed', 'procedures', 'revenue'];
    const run = {}, prev = {};
    keys.forEach(k => { run[k] = 0; prev[k] = 0; });
    const monthly = [], cumulative = [];
    let taSum = 0, taWeight = 0;

    for (let m = 0; m < 12; m++) {
      const ramp = withQCT ? clamp((m + 1) / Math.max(1, A.qctRampMonths.value), 0, 1) : 0;
      const scans = inputs.ctVolume * w[m];
      const findings = scans * A.incidentalFindingRate.value;
      const missed = findings * lerp(A.missRateBaseline.value, A.missRateWithQCT.value, ramp);
      const flagged = findings - missed;
      const completed = flagged * lerp(A.followUpCompletionBaseline.value, A.followUpCompletionWithQCT.value, ramp);
      const procedures = completed * A.proceduresPerCompletedFollowUp.value;
      const revenue = completed * A.valuePerCompletedFollowUp.value * R.valueMultiplier;
      const load = 1 + (w[m] * 12 - 1) * A.seasonalLoadSensitivity.value;
      const turnaround = lerp(A.turnaroundDaysBaseline.value, A.turnaroundDaysWithQCT.value, ramp) * R.turnaroundMultiplier * load;

      const raw = { scans, findings, missed, completed, procedures, revenue };
      const row = { month: m, ramp, turnaroundDays: round1(turnaround) };
      const cum = { month: m };
      keys.forEach(k => {
        run[k] += raw[k];
        const r = Math.round(run[k]);
        row[k] = r - prev[k];
        prev[k] = r;
        cum[k] = r;
      });
      row.flagged = row.findings - row.missed;
      row.lost = row.flagged - row.completed;
      cum.flagged = cum.findings - cum.missed;
      cum.lost = cum.flagged - cum.completed;
      taSum += turnaround * flagged;
      taWeight += flagged;
      cum.turnaroundDays = round1(taWeight ? taSum / taWeight : 0);
      monthly.push(row);
      cumulative.push(cum);
    }
    return { withQCT, monthly, cumulative, totals: cumulative[11] };
  }

  function run(rawInputs, cfg) {
    const inputs = sanitiseInputs(rawInputs, cfg);
    const without = scenario(inputs, cfg, false);
    const withQ = scenario(inputs, cfg, true);
    const B = without.totals, W = withQ.totals;
    const pair = k => ({ without: B[k], with: W[k], delta: W[k] - B[k] });
    return {
      inputs,
      region: cfg.regions[inputs.region],
      facility: facility(inputs, cfg),
      without,
      with: withQ,
      outcome: {
        findingsCaught: pair('flagged'),
        followUpsCompleted: pair('completed'),
        downstreamProcedures: pair('procedures'),
        revenueRetained: { value: W.revenue - B.revenue, without: B.revenue, with: W.revenue },
        followUpsLost: pair('lost'),
        turnaroundDays: { without: B.turnaroundDays, with: W.turnaroundDays }
      }
    };
  }

  // Human-readable assumption list for whichever region is selected.
  function describeAssumptions(rawInputs, cfg) {
    const inputs = sanitiseInputs(rawInputs, cfg);
    const R = cfg.regions[inputs.region];
    const list = Object.keys(cfg.assumptions).map(key => {
      const a = cfg.assumptions[key];
      return { key, label: a.label, value: (fmt[a.unit] || String)(a.value), status: a.status };
    });
    list.push({ key: 'regionValue', label: 'Value multiplier · ' + R.label, value: fmt.mult(R.valueMultiplier), status: R.status });
    list.push({ key: 'regionTurnaround', label: 'Turnaround multiplier · ' + R.label, value: fmt.mult(R.turnaroundMultiplier), status: R.status });
    cfg.modelNotes.forEach((n, i) => list.push({ key: 'note' + i, label: n, value: '', status: 'MODEL', note: true }));
    return list;
  }

  return { run, describeAssumptions, sanitiseInputs, facility, fmt };
})();


/* =====================================================================
   === TIMELINE: pure phase clock (durations come from CSS timings) ===
   ===================================================================== */
const TIMELINE = (() => {
  function build(d) {
    const year = d.yearTitle + 12 * d.month;
    let acc = 0;
    const segs = [['build', d.build], ['without', year], ['with', year], ['outcome', d.outcome]].map(([id, dur]) => {
      const s = { id, start: acc, dur };
      acc += dur;
      return s;
    });
    return { segs, total: acc, d };
  }
  function at(tl, elapsed) {
    const e = Math.max(0, elapsed);
    for (const s of tl.segs) if (e < s.start + s.dur) return { id: s.id, local: e - s.start, seg: s };
    const last = tl.segs[tl.segs.length - 1];
    return { id: last.id, local: e - last.start, seg: last, done: true };
  }
  const monthFloat = (tl, local) => Math.min(12, Math.max(0, (local - tl.d.yearTitle) / tl.d.month));
  const offsetOf = (tl, id) => tl.segs.find(s => s.id === id).start;
  return { build, at, monthFloat, offsetOf };
})();


/* =====================================================================
   === SYNC: shared state across windows (BroadcastChannel + storage) ===
   One small state object; last writer wins by timestamp. Phase timing is
   derived from playStartedAt, so both windows agree without chatter.
   ===================================================================== */
const SYNC = (() => {
  const ID = Math.random().toString(36).slice(2, 10);
  const KEY = 'qure-qct-booth/state/v1', CHANNEL = 'qure-qct-booth';
  const listeners = [], peers = {};
  let view = 'none';

  const fresh = () => ({
    screen: 'welcome',
    inputs: { beds: CONFIG.inputs.beds.default, ctVolume: CONFIG.inputs.ctVolume.default, region: CONFIG.inputs.region.default },
    introEnabled: CONFIG.intro.enabled,
    introSlice: 0,
    introFound: false,
    playStartedAt: 0,
    pausedElapsed: null,
    speed: 1,
    at: 0,
    by: ID
  });

  let state = fresh();
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.inputs) state = Object.assign(fresh(), saved);
  } catch (e) { /* storage unavailable: run without persistence */ }

  let bc = null;
  try { bc = new BroadcastChannel(CHANNEL); bc.onmessage = e => receive(e.data); } catch (e) { bc = null; }
  window.addEventListener('storage', e => {
    if (e.key === KEY && e.newValue) { try { receive({ type: 'state', state: JSON.parse(e.newValue) }); } catch (err) { /* ignore */ } }
  });

  const newer = (a, b) => a.at > b.at || (a.at === b.at && a.by > b.by);
  const post = msg => { if (bc) try { bc.postMessage(msg); } catch (e) { /* closed */ } };
  const emit = () => listeners.forEach(fn => fn(state));

  function receive(msg) {
    if (!msg || typeof msg !== 'object') return;
    if (msg.view) peers[msg.view] = Date.now();
    if (msg.type === 'hello') post({ type: 'state', state, view });
    if (msg.type === 'state' && msg.state && newer(msg.state, state)) { state = msg.state; emit(); }
  }

  function set(patch) {
    const next = Object.assign({}, state, patch);
    if (patch.inputs) next.inputs = Object.assign({}, state.inputs, patch.inputs);
    next.at = Math.max(Date.now(), state.at + 1);
    next.by = ID;
    state = next;
    post({ type: 'state', state, view });
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
    emit();
  }

  function elapsed() {
    if (state.pausedElapsed != null) return state.pausedElapsed;
    return (Date.now() - state.playStartedAt) * (state.speed || 1);
  }

  function start(v) {
    view = v;
    post({ type: 'hello', view });
    setInterval(() => post({ type: 'ping', view }), 1500);
  }

  return {
    get: () => state,
    set,
    elapsed,
    start,
    fresh,
    on: fn => listeners.push(fn),
    peers: () => peers,
    id: ID
  };
})();


/* =====================================================================
   === RENDER: shared helpers — reads engine output, never computes it ===
   ===================================================================== */
const UI = (() => {
  const rootCS = () => getComputedStyle(document.documentElement);
  const cssVar = name => rootCS().getPropertyValue(name).trim();
  const cssNum = name => parseFloat(cssVar(name));
  const cssMs = name => { const v = cssVar(name); return v.endsWith('ms') ? parseFloat(v) : parseFloat(v) * 1000; };
  const clamp01 = v => Math.min(1, Math.max(0, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const tpl = (s, vars) => String(s).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] != null ? vars[k] : m));
  const rich = s => esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>');
  const getPath = (obj, path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);

  function fillCopy(root) {
    root.querySelectorAll('[data-copy]').forEach(el => {
      const v = getPath(CONFIG.copy, el.dataset.copy);
      if (typeof v === 'string') el.innerHTML = rich(v);
    });
    root.querySelectorAll('[data-copy-placeholder]').forEach(el => {
      el.placeholder = getPath(CONFIG.copy, el.dataset.copyPlaceholder) || '';
    });
  }

  // Writes text only when it changed (cheap to call every frame).
  function bind(root, key, value, html) {
    root.querySelectorAll(`[data-bind="${key}"]`).forEach(el => {
      if (el.__v === value) return;
      el.__v = value;
      if (html) el.innerHTML = value; else el.textContent = value;
    });
  }

  function fit(stage, w, h) {
    const s = Math.min(innerWidth / w, innerHeight / h);
    stage.style.transform = `translate(${((innerWidth - w * s) / 2).toFixed(1)}px, ${((innerHeight - h * s) / 2).toFixed(1)}px) scale(${s})`;
    return s;
  }

// Phase each view should show, derived from shared state + clock.
function deriveView(state, tl) {
  switch (state.screen) {
    case 'welcome': return { wall: 'attract', tablet: 'welcome' };
    case 'intro':   return { wall: 'intro', tablet: 'intro' };
    case 'inputs':  return { wall: 'inputs', tablet: 'inputs' };
    case 'results': return { wall: 'outcome', tablet: 'results', local: Infinity };

   === RENDER: isometric hospital (SVG) ===

   ===================================================================== */
const HOSPITAL = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const C30 = Math.cos(Math.PI / 6), S30 = 0.5;
  // Line glyphs drawn on box tops, in a [-.5, .5] square.

    const g = svgEl('g', { class: 'box' + (b.qct ? ' is-qct' : '') + (b.cls ? ' ' + b.cls : ''), 'data-id': b.id }, parent);

    svgEl('path', { class: 'face face-right', d: pathOf([P(x + w, y, z0), P(x + w, y + d, z0), P(x + w, y + d, z1), P(x + w, y, z1)]) + 'Z' }, g);

  /* opts: { svg, labelsEl?, model, unit, area:{x,y,w,h} } → handle */
  function build(opts) {
    const { svg, labelsEl, model, area } = opts;
    let unit = opts.unit;
    const fac = model.facility;
    const L = layout(fac, model.inputs);
    // Fit: centre the projected bounding box (plus label headroom) in the area,
    // shrinking the unit if a large hospital would not fit at the styled size.
    function measure(u) {
      const P0 = (x, y, z = 0) => [(x - y) * C30 * u, (x + y) * S30 * u - z * u];
      const m = { P0, minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
      const grow = p => { m.minX = Math.min(m.minX, p[0]); m.maxX = Math.max(m.maxX, p[0]); m.minY = Math.min(m.minY, p[1]); m.maxY = Math.max(m.maxY, p[1]); };
      L.boxes.forEach(b => { const z1 = (b.z0 || 0) + b.h; [[b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.d], [b.x + b.w, b.y + b.d]].forEach(([x, y]) => { grow(P0(x, y, 0)); grow(P0(x, y, z1)); }); });

    };

    // Floor plate + grid

    L.boxes.forEach(b => { fx0 = Math.min(fx0, b.x); fx1 = Math.max(fx1, b.x + b.w); fy0 = Math.min(fy0, b.y); fy1 = Math.max(fy1, b.y + b.d); });
    fx0 = Math.floor(fx0 - 1); fy0 = Math.floor(fy0 - 1); fx1 = Math.ceil(Math.max(fx1, L.exit[0]) + 1); fy1 = Math.ceil(fy1 + 1);

    svgEl('path', { class: 'floor-plate', d: pathOf([P(fx0, fy0), P(fx1, fy0), P(fx1, fy1), P(fx0, fy1)]) + 'Z' }, floor);
    for (let gx = fx0; gx <= fx1; gx++) svgEl('path', { class: 'floor-grid', d: pathOf([P(gx, fy0), P(gx, fy1)]) }, floor);
    for (let gy = fy0; gy <= fy1; gy++) svgEl('path', { class: 'floor-grid', d: pathOf([P(fx0, gy), P(fx1, gy)]) }, floor);

        d.style.top = p[1].toFixed(1) + 'px';

/* =====================================================================
   === RENDER: patient particles (canvas) ===
   Dots are a visual sample of engine output: fates per month are
   allocated in the same proportions the ENGINE reports. Positions are a
   pure function of time, so dev jumps and replays are exact.
   ===================================================================== */
const PARTICLES = (() => {
  const TAU = Math.PI * 2;
  const ORDER = { in: 0, scan: 1, toRead: 2, read: 3, toReport: 4, exit: 5, toDesk: 5, desk: 6, drift: 6, toClinic: 7, clinic: 8 };

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function niceCeil(v) {
    if (v <= 1) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
    return 10 * p;
  }
  const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  const polyLen = pts => { let L = 0; for (let i = 1; i < pts.length; i++) L += dist(pts[i - 1], pts[i]); return L; };
  function along(pts, d) {
    for (let i = 1; i < pts.length; i++) {
      const l = dist(pts[i - 1], pts[i]);
      if (d <= l || i === pts.length - 1) {
        const t = l ? Math.min(1, d / l) : 1;
        return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t];
      }
      d -= l;
    }
    return pts[pts.length - 1];
  }
  const move = (pts, speed, tag) => { const L = polyLen(pts); return { type: 'move', pts, L, dur: Math.max(.05, L / speed), tag }; };
  const dwell = (at, dur, tag) => ({ type: 'dwell', at, dur, tag });

  function timing() {
    const s = n => UI.cssMs(n) / 1000;
    return {
      speed: UI.cssNum('--particle-speed'), yearTitle: s('--t-year-title'), month: s('--t-month'), lead: s('--t-lead'),
      dwellScan: s('--t-dwell-scan'), dwellRead: s('--t-dwell-read'), dwellDesk: s('--t-dwell-desk'), dwellClinic: s('--t-dwell-clinic'),
      drift: s('--t-drift'), pulse: s('--t-pulse')
    };
  }

  function schedule(model, L, scenarioId) {
    const T = timing(), V = CONFIG.visual;
    const scn = model[scenarioId], base = model.without;
    const rng = mulberry32(V.seed + model.inputs.beds * 7 + model.inputs.ctVolume + (scenarioId === 'with' ? 101 : 0));
    const scansPerDot = niceCeil(base.totals.scans / 12 / V.dotsPerMonth);
    const findingsPerDot = niceCeil(base.totals.findings / 12 / V.findingDotsPerMonth);
    const list = [];
    let prevF = 0, prevMiss = 0, prevLost = 0;

    function make(fate, spawn) {
      const k = Math.floor(rng() * L.scannersC.length);
      const j = (rng() - .5) * .34;
      const off = p => [p[0] + j, p[1] + j];
      const segs = [
        move(L.paths.toScanner[k].map(off), T.speed, 'in'),
        dwell(off(L.scannersC[k]), T.dwellScan * (.8 + rng() * .4), 'scan'),
        move(L.paths.toReading[k].map(off), T.speed, 'toRead'),
        dwell(off(L.nodes.reading), T.dwellRead, 'read'),
        move(L.paths.toReport.map(off), T.speed, 'toReport')
      ];
      if (fate === 'normal' || fate === 'missed') {
        segs.push(move(L.paths.toExit.map(off), T.speed, 'exit'));
      } else if (fate === 'completed') {
        const c = Math.floor(rng() * L.clinicsC.length);
        segs.push(move(L.paths.toDesk.map(off), T.speed, 'toDesk'));
        segs.push(dwell(off(L.nodes.desk), T.dwellDesk, 'desk'));
        segs.push(move(L.paths.toClinic[c].map(off), T.speed, 'toClinic'));
        segs.push(dwell(off(L.clinicsC[c]), T.dwellClinic, 'clinic'));
      } else { // lost: stalls on the way to the desk, drifts off the path, fades
        const pts = L.paths.toDesk.map(off);
        const stop = along(pts, (.3 + rng() * .45) * polyLen(pts));
        segs.push(move([pts[0], stop], T.speed, 'toDesk'));
        const drift = move([stop, [stop[0] + .9 + rng() * .5, stop[1] + (rng() - .5) * .4]], 1, 'drift');
        drift.dur = T.drift;
        segs.push(drift);
      }
      let total = 0;
      segs.forEach(s => { s.t0 = total; total += s.dur; });
      return { fate, finding: fate !== 'normal', spawn: Math.max(0, spawn), segs, total, readT0: segs[3].t0 };
    }

    for (let m = 0; m < 12; m++) {
      const row = scn.monthly[m], cum = scn.cumulative[m];
      const nNorm = Math.max(1, Math.round(row.scans / scansPerDot));
      const fCum = Math.round(cum.findings / findingsPerDot);
      const nF = Math.max(0, fCum - prevF); prevF = fCum;
      const share = k => cum.findings ? cum[k] / cum.findings : 0;

    const pill = stage.querySelector('.w-intro-status');
    pill.classList.toggle('is-found', found);
    const vars = { i: active + 1, n: N };
    UI.bind(stage, 'introPill', UI.tpl(found ? CONFIG.copy.introPillFound : inRange ? CONFIG.copy.introPillAnalysing : CONFIG.copy.introPillReading, vars));
  }

  return { init, frame, timeline: () => tl };
})();


/* =====================================================================
   === RENDER: tablet (1180×820) ===
   ===================================================================== */
const TABLET = (() => {
  const W = 1180, H = 820;
  let stage, tl, modelKey = null, model = null, screen = null, art = null;
  let dragging = false, rangeSince = null, lastTouch = Date.now(), pending = null;

  function init() {
    stage = document.getElementById('tablet');
    UI.fillCopy(stage);
    tl = TIMELINE.build(UI.durations());

    // Sliders + region buttons from CONFIG
    stage.querySelectorAll('input[type=range][data-input]').forEach(inp => {
      const spec = CONFIG.inputs[inp.dataset.input];
      inp.min = spec.min; inp.max = spec.max; inp.step = spec.step;
      inp.addEventListener('pointerdown', () => { dragging = true; });
      inp.addEventListener('input', () => queueInput({ [inp.dataset.input]: +inp.value }));
    });
    addEventListener('pointerup', () => { dragging = false; });
    const seg = stage.querySelector('.seg');
    seg.innerHTML = Object.keys(CONFIG.regions).map(id => `<button type="button" role="radio" data-region="${id}" aria-checked="false">${UI.esc(CONFIG.regions[id].short || CONFIG.regions[id].label)}</button>`).join('');
    seg.addEventListener('click', e => { const b = e.target.closest('[data-region]'); if (b) SYNC.set({ inputs: { region: b.dataset.region } }); });

    // Steps list
    const c = CONFIG.copy;
    stage.querySelector('.t-steps').innerHTML = ['build', 'without', 'with', 'outcome'].map((id, i) => `<li data-step="${id}"><span class="mono">0${i + 1}</span>${UI.esc(c.steps[id])}</li>`).join('');

    // Actions
    stage.addEventListener('click', e => {
      const a = e.target.closest('[data-action]');
      if (!a || a.tagName === 'FORM') return;
      const st = SYNC.get();
      switch (a.dataset.action) {
        case 'start': SYNC.set({ screen: st.introEnabled ? 'intro' : 'inputs', introSlice: 0, introFound: false }); break;
        case 'intro-continue':
        case 'intro-skip': SYNC.set({ screen: 'inputs' }); break;
        case 'build': SYNC.set({ screen: 'playing', playStartedAt: Date.now(), pausedElapsed: null }); break;
        case 'skip': SYNC.set({ screen: 'results' }); break;
        case 'restart': restart(); break;
      }
    });
    stage.querySelector('form[data-action="email"]').addEventListener('submit', e => {
      e.preventDefault();
      UI.bind(stage, 'emailNote', CONFIG.copy.emailNoteSent);
    });
    ['pointerdown', 'keydown'].forEach(t => addEventListener(t, () => { lastTouch = Date.now(); }, true));

    // Slicer
    const track = stage.querySelector('.t-slicer-track');
    const setFrom = ev => {
      const r = track.getBoundingClientRect(), hh = track.querySelector('.t-slicer-handle').offsetHeight * (r.height / track.clientHeight);
      queueInput(null, { introSlice: UI.clamp01((ev.clientY - r.top - hh / 2) / (r.height - hh)) });
    };
    track.addEventListener('pointerdown', ev => { track.setPointerCapture(ev.pointerId); track.__drag = true; setFrom(ev); });
    track.addEventListener('pointermove', ev => { if (track.__drag) setFrom(ev); });
    track.addEventListener('pointerup', () => { track.__drag = false; });
    track.addEventListener('pointercancel', () => { track.__drag = false; });

    // Welcome art: static default hospital
    const artModel = ENGINE.run({}, CONFIG);
    HOSPITAL.build({ svg: stage.querySelector('.t-art'), model: artModel, unit: UI.cssNum('--iso-unit-preview'), area: { x: 10, y: 20, w: 450, h: 480 } });

    resize();
    addEventListener('resize', resize);
  }

  // Coalesce high-frequency input (sliders, slicer) to one broadcast per frame.
  function queueInput(inputs, extra) {
    pending = pending || {};
    if (inputs) pending.inputs = Object.assign(pending.inputs || {}, inputs);
    if (extra) Object.assign(pending, extra);
  }

  function restart() {
    const f = SYNC.fresh();
    SYNC.set({ screen: 'welcome', inputs: f.inputs, introSlice: 0, introFound: false, pausedElapsed: null });
    UI.bind(stage, 'emailNote', CONFIG.copy.emailNote);
    const email = stage.querySelector('#in-email'); if (email) email.value = '';
  }

  function resize() { UI.fit(stage, W, H); }

  function ensureModel(st) {
    const key = JSON.stringify(st.inputs);
    if (key === modelKey) return;
    modelKey = key;
    model = ENGINE.run(st.inputs, CONFIG);
    const f = ENGINE.fmt, i = model.inputs, fac = model.facility;
    UI.bind(stage, 'beds', f.int(i.beds));
    UI.bind(stage, 'ctVolume', f.int(i.ctVolume));
    UI.bind(stage, 'facilityCaption', UI.tpl(CONFIG.copy.facilityCaption, { scanners: fac.scanners, clinics: fac.clinics, floors: fac.wardFloors }));
    HOSPITAL.build({ svg: stage.querySelector('.t-preview svg'), model, unit: UI.cssNum('--iso-unit-preview'), area: { x: 10, y: 16, w: 450, h: 440 } });
    stage.querySelectorAll('[data-region]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.region === i.region)));
    UI.bind(stage, 'resultsOverline', UI.tpl(CONFIG.copy.resultsOverline, UI.specVars(i)));
    stage.querySelector('.t-metrics').innerHTML = UI.metrics(model).map(m => `
      <div class="t-metric">
        <div class="m-head"><span class="m-label">${UI.esc(m.label)}</span><span class="sample">${UI.esc(CONFIG.copy.sample)}</span></div>
        <div class="m-value">${UI.esc(m.fmt(m.value))}</div>
        <div class="m-sub">${UI.esc(m.delta)}</div>
      </div>`).join('');
    UI.renderAssumptions(stage.querySelector('.t-assumptions .assump-list'), i);
  }

  function frame(now) {
    if (pending) { SYNC.set(pending); pending = null; }
    const st = SYNC.get();
    ensureModel(st);
    const v = deriveView(st, tl);
    if (v.tablet !== screen) { screen = v.tablet; stage.dataset.screen = screen; if (screen === 'results') lastTouch = Date.now(); }

    // Sliders follow shared state unless the visitor is mid-drag.
    if (!dragging) stage.querySelectorAll('input[type=range][data-input]').forEach(inp => { const val = st.inputs[inp.dataset.input]; if (+inp.value !== val) inp.value = val; });
    stage.querySelectorAll('input[type=range][data-input]').forEach(inp => {
      const pct = ((inp.value - inp.min) / (inp.max - inp.min) * 100).toFixed(2) + '%';
      if (inp.__fill !== pct) { inp.__fill = pct; inp.style.setProperty('--fill', pct); }
    });

    if (screen === 'intro') intro(st, now);
    if (screen === 'playing') playing(v);
    if (screen === 'results' && CONFIG.idleResetSeconds && Date.now() - lastTouch > CONFIG.idleResetSeconds * 1000) restart();
  }

  function intro(st, now) {
    const c = CONFIG.copy, N = CONFIG.intro.slices, s = UI.clamp01(st.introSlice || 0);
    const active = Math.round(s * (N - 1)), d = active / (N - 1);
    const [a, b] = CONFIG.intro.findingRange, inRange = d >= a && d <= b;
    if (inRange && !st.introFound) {
      if (rangeSince == null) rangeSince = now;
      else if (now - rangeSince >= CONFIG.intro.dwellMs) queueInput(null, { introFound: true });
    } else rangeSince = null;

    const track = stage.querySelector('.t-slicer-track'), handle = track.querySelector('.t-slicer-handle');
    const top = (s * (track.clientHeight - handle.offsetHeight)).toFixed(1) + 'px';
    if (handle.style.top !== top) { handle.style.top = top; track.querySelector('.t-slicer-fill').style.height = top; }
    UI.bind(stage, 'sliceReadout', UI.tpl(c.sliceReadout, { i: active + 1, n: N }));
    const status = stage.querySelector('.t-intro-status');
    const state = st.introFound ? 'found' : inRange ? 'reading' : s > 0 ? 'reading' : 'idle';
    status.className = 't-intro-status is-' + state;
    UI.bind(stage, 'introStatus', st.introFound ? c.introStatusFound : s > 0 ? c.introStatusReading : c.introStatusIdle);
    stage.querySelector('[data-action="intro-continue"]').disabled = !st.introFound;
  }

  function playing(v) {
    const c = CONFIG.copy, id = v.phase.id;
    UI.bind(stage, 'phaseName', c.phaseNames[id]);
    const ids = ['build', 'without', 'with', 'outcome'], idx = ids.indexOf(id);
    stage.querySelectorAll('.t-steps li').forEach((li, i) => { li.classList.toggle('is-done', i < idx); li.classList.toggle('is-active', i === idx); });
    const outcomeAt = TIMELINE.offsetOf(tl, 'outcome');
    const p = Math.min(1, v.elapsed / outcomeAt);
    stage.querySelector('.t-progress-fill').style.width = (p * 100).toFixed(2) + '%';
    let month = '';
    if (id === 'without' || id === 'with') {
      const mf = TIMELINE.monthFloat(tl, v.local), m = Math.min(11, Math.floor(mf));
      month = mf > 0 ? UI.tpl(c.monthReadout, { m: m + 1, name: c.months[m] }) : '';
    }
    UI.bind(stage, 'playMonth', month);
    UI.bind(stage, 'playRemaining', UI.tpl(c.remaining, { s: Math.max(0, Math.ceil((outcomeAt - v.elapsed) / 1000)) }));
  }

  return { init, frame, timeline: () => tl };
})();


/* =====================================================================
   === DEV: panel (press D) — jump phases, tweak inputs, check sync ===
   ===================================================================== */
const DEV = (() => {
  let el, view, tl;
  const PHASES = ['welcome', 'intro', 'inputs', 'build', 'without', 'with', 'outcome', 'results'];

  function init(v, timeline) {
    view = v; tl = timeline;
    el = document.createElement('div');
    el.className = 'dev';
    el.hidden = true;
    const I = CONFIG.inputs;
    el.innerHTML = `
      <div class="dev-head"><span>Dev · ${view}</span><button data-dev="close">close · D</button></div>
      <div class="dev-row"><div class="dev-k"><span>Jump to phase</span></div><div class="dev-btns">${PHASES.map(p => `<button data-phase="${p}">${p}</button>`).join('')}</div></div>
      <div class="dev-row"><label>Beds <span data-dev="beds"></span></label><input type="range" data-dev-input="beds" min="${I.beds.min}" max="${I.beds.max}" step="${I.beds.step}"></div>
      <div class="dev-row"><label>CT / year <span data-dev="ctVolume"></span></label><input type="range" data-dev-input="ctVolume" min="${I.ctVolume.min}" max="${I.ctVolume.max}" step="${I.ctVolume.step}"></div>
      <div class="dev-row"><label>Region</label><select data-dev-input="region">${Object.keys(CONFIG.regions).map(k => `<option value="${k}">${CONFIG.regions[k].label}</option>`).join('')}</select></div>
      <div class="dev-row"><div class="dev-k"><span>Intro (CONFIG.intro.enabled)</span></div><div class="dev-btns"><button data-dev="intro"></button></div></div>
      <div class="dev-row"><div class="dev-k"><span>Playback</span></div><div class="dev-btns">${[.5, 1, 2, 4, 8].map(s => `<button data-speed="${s}">${s}×</button>`).join('')}<button data-dev="pause">pause</button></div></div>
      <div class="dev-row"><div class="dev-btns"><button data-dev="reset">reset state</button><a href="#preview" style="color:inherit">preview</a><a href="#${view === 'wall' ? 'tablet' : 'wall'}" target="qct-${view === 'wall' ? 'tablet' : 'wall'}" style="color:inherit">open ${view === 'wall' ? 'tablet' : 'wall'}</a></div></div>
      <pre data-dev="readout"></pre>`;
    document.body.appendChild(el);

    addEventListener('keydown', e => {
      if (e.key !== 'd' && e.key !== 'D') return;
      const t = e.target;
      if (t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type !== 'range'))) return;
      el.hidden = !el.hidden;
    });
    el.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.phase) jump(b.dataset.phase);
      if (b.dataset.speed) speed(+b.dataset.speed);
      if (b.dataset.dev === 'close') el.hidden = true;
      if (b.dataset.dev === 'pause') pause();
      if (b.dataset.dev === 'intro') SYNC.set({ introEnabled: !SYNC.get().introEnabled });
      if (b.dataset.dev === 'reset') SYNC.set(Object.assign(SYNC.fresh(), { by: SYNC.id }));
    });
    el.querySelectorAll('[data-dev-input]').forEach(inp => inp.addEventListener('input', () => {
      const k = inp.dataset.devInput;
      SYNC.set({ inputs: { [k]: k === 'region' ? inp.value : +inp.value } });
    }));
  }

  function jump(p) {
    const st = SYNC.get();
    if (['welcome', 'intro', 'inputs', 'results'].includes(p)) { SYNC.set({ screen: p, introSlice: p === 'intro' ? 0 : st.introSlice, introFound: p === 'intro' ? false : st.introFound }); return; }
    const off = TIMELINE.offsetOf(tl, p) + 1;
    SYNC.set({ screen: 'playing', playStartedAt: Date.now() - off / (st.speed || 1), pausedElapsed: st.pausedElapsed != null ? off : null });
  }
  function speed(s) {
    const st = SYNC.get(), e = SYNC.elapsed();
    SYNC.set({ speed: s, playStartedAt: Date.now() - e / s });
  }
  function pause() {
    const st = SYNC.get();
    if (st.pausedElapsed != null) SYNC.set({ pausedElapsed: null, playStartedAt: Date.now() - st.pausedElapsed / (st.speed || 1) });
    else SYNC.set({ pausedElapsed: SYNC.elapsed() });
  }

  function frame() {
    if (!el || el.hidden) return;
    const st = SYNC.get(), v = deriveView(st, tl);
    el.querySelectorAll('[data-phase]').forEach(b => b.classList.toggle('is-on', b.dataset.phase === (st.screen === 'playing' ? v.wall : st.screen)));
    el.querySelectorAll('[data-speed]').forEach(b => b.classList.toggle('is-on', +b.dataset.speed === (st.speed || 1)));
    el.querySelector('[data-dev="pause"]').classList.toggle('is-on', st.pausedElapsed != null);
    const ib = el.querySelector('[data-dev="intro"]');
    ib.textContent = st.introEnabled ? 'on' : 'off'; ib.classList.toggle('is-on', st.introEnabled);
    el.querySelectorAll('[data-dev-input]').forEach(inp => { if (document.activeElement !== inp) inp.value = st.inputs[inp.dataset.devInput]; });
    el.querySelector('[data-dev="beds"]').textContent = st.inputs.beds;
    el.querySelector('[data-dev="ctVolume"]').textContent = st.inputs.ctVolume.toLocaleString('en-US');
    const peers = SYNC.peers(), now = Date.now();
    const peerTxt = Object.keys(peers).filter(k => k !== 'none').map(k => `${k} ${now - peers[k] < 4000 ? '●' : '○'}`).join('  ') || 'none seen';
    const e = st.screen === 'playing' ? SYNC.elapsed() : 0;
    el.querySelector('[data-dev="readout"]').textContent =
      `screen   ${st.screen}\nwall     ${v.wall}\ntablet   ${v.tablet}\n` +
      `elapsed  ${(e / 1000).toFixed(1)}s / ${(tl.total / 1000).toFixed(1)}s\n` +
      (v.local != null && isFinite(v.local) ? `local    ${(v.local / 1000).toFixed(1)}s\n` : '') +
      `peers    ${peerTxt}\nstate    ${new Date(st.at).toLocaleTimeString()} by ${st.by === SYNC.id ? 'this window' : st.by}`;
  }

  return { init, frame };
})();


/* =====================================================================
   === BOOT: hash router + single frame loop ===
   ===================================================================== */
(function boot() {
  let active = null;
  const started = {};

  function route() {
    const h = (location.hash || '').replace('#', '').toLowerCase();
    const view = ['wall', 'tablet', 'preview'].includes(h) ? h : 'launcher';
    document.getElementById('launcher').hidden = view !== 'launcher';
    document.getElementById('preview').hidden = view !== 'preview';
    document.getElementById('wall-root').hidden = view !== 'wall';
    document.getElementById('tablet-root').hidden = view !== 'tablet';
    if (view === 'launcher') UI.fillCopy(document.getElementById('launcher'));
    if (view === 'preview') {
      document.querySelectorAll('#preview iframe').forEach(f => { if (!f.src) f.src = location.pathname + location.search + '#' + f.dataset.view; });
    }
    if ((view === 'wall' || view === 'tablet') && !started[view]) {
      const mod = view === 'wall' ? WALL : TABLET;
      mod.init();
      DEV.init(view, mod.timeline());
      SYNC.start(view);
      started[view] = mod;
    }
    document.title = CONFIG.copy.title.replace(/\*/g, '') + (view === 'wall' || view === 'tablet' ? ' · ' + view : '');
    active = started[view] || null;
  }

  function loop(now) {
    if (active) { active.frame(now); DEV.frame(); }
    requestAnimationFrame(loop);
  }

  addEventListener('hashchange', route);
  route();
  requestAnimationFrame(loop);
  window.__booth = { CONFIG, ENGINE, TIMELINE, SYNC, deriveView };
})();
</script>
</body>
