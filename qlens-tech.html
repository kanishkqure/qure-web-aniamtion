<style>
body{margin:0;background:#fff;display:grid;place-items:center;min-height:100vh}
.qlens-tech-wrap{width:min(1280px,100% - 32px);margin:0 auto}
/* ---- component ---- */
.qlens-tech{display:block;width:100%;height:auto;font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.qlens-tech .mono{font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.qlens-tech #qt-dots circle{fill:#D9D9FF;fill-opacity:.4}
.qlens-tech .reg{fill:none;stroke:#C9C9D4;stroke-width:1}
.qlens-tech .edge{fill:none;stroke:#303030;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.qlens-tech .inner{fill:none;stroke:#303030;stroke-opacity:.12;stroke-width:1}
.qlens-tech .glyph{stroke:#303030}
.qlens-tech .hero .edge,.qlens-tech .hero .glyph{stroke:#E0574A}
.qlens-tech .hero .inner{stroke:#E0574A;stroke-opacity:.35}
.qlens-tech .ev .edge{stroke-width:1.25}
.qlens-tech .ev .inner{stroke:#2A288C;stroke-opacity:.15}
.qlens-tech #feeds path{fill:none;stroke:#A9A8E8;stroke-width:1.6;stroke-dasharray:0 4.5;stroke-linecap:round}
.qlens-tech .port{fill:#A9A8E8}
.qlens-tech .ev-lbl text{font-size:10px;fill:#8A8A99;letter-spacing:.12em}
.qlens-tech #connectors path:not(#ticks){fill:none;stroke:#303030;stroke-width:1}
.qlens-tech #ticks{fill:none;stroke:#8A8A99;stroke-width:1}
.qlens-tech .tick-lbl{font-size:7px;fill:#8A8A99;letter-spacing:.04em}
.qlens-tech #links path{fill:none;stroke:#8A8A99;stroke-width:1}
.qlens-tech .leader{fill:none;stroke:#303030;stroke-width:.75}
.qlens-tech .ev-lbl .leader{stroke:#8A8A99}
.qlens-tech .leader-dot{fill:#303030}
.qlens-tech .name{font-size:15px;fill:#303030;font-weight:500}
.qlens-tech .stage{font-size:10px;fill:#8A8A99;letter-spacing:.14em}
.qlens-tech .frame-bg{fill:#fff;stroke:#E6E6F0;stroke-width:1}
.qlens-tech .frame-rule{fill:none;stroke:#E6E6F0;stroke-width:1}
.qlens-tech .chrome-dots{fill:#ECECF2}
.qlens-tech .sk{fill:#ECECF2}
.qlens-tech .sk-l{fill:#F3F3F7}
.qlens-tech .sk-m,.qlens-tech .sk-d{fill:#E1E1E9}
.qlens-tech .stat-bg{fill:#fff;stroke:#ECECF2}
.qlens-tech .cb{fill:#2A288C}
.qlens-tech .cb.accent{fill:#FF7869}
.qlens-tech .dot-i{fill:#2A288C}
.qlens-tech .dot-l{fill:#D9D9FF}
.qlens-tech .status rect{fill:#fff;stroke:#E6E6F0}
.qlens-tech .status text{font-size:10px;fill:#303030;letter-spacing:.12em}
.qlens-tech .status .sdot{fill:#FF7869}
.qlens-tech .status.done .sdot{fill:#2A288C}
</style>
</head>
