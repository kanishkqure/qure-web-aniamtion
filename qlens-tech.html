<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>qLens Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;display:grid;place-items:center;min-height:100vh}
.qlens-tech-wrap{width:min(1280px,100% - 32px);margin:0 auto}
/* ---- component ---- */
.qlens-tech{display:block;width:100%;height:auto;font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.qlens-tech .mono,.qlens-tech .jl{font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.qlens-tech #qt-dots circle{fill:#D9D9FF;fill-opacity:.4}
.qlens-tech .reg{fill:none;stroke:#C9C9D4;stroke-width:1}
.qlens-tech .face{stroke:#303030;stroke-width:1.5;stroke-linejoin:round}
.qlens-tech .inner{fill:none;stroke:#303030;stroke-opacity:.12;stroke-width:1;stroke-linejoin:round}
.qlens-tech .glyph{stroke:#303030}
.qlens-tech .hero .face{stroke:#E0574A}
.qlens-tech .hero .inner{stroke:#E0574A;stroke-opacity:.35}
.qlens-tech .hero .glyph{stroke:#E0574A}
.qlens-tech #connectors path:not(#ticks){fill:none;stroke:#303030;stroke-width:1}
.qlens-tech #ticks{fill:none;stroke:#8A8A99;stroke-width:1}
.qlens-tech .tick-lbl{font-size:7px;fill:#8A8A99;letter-spacing:.04em}
.qlens-tech #links path{fill:none;stroke:#8A8A99;stroke-width:1}
.qlens-tech #feeds path{fill:none;stroke:#2A288C;stroke-opacity:.55;stroke-width:1;stroke-dasharray:1.5 3.5;stroke-linecap:round}
.qlens-tech .chip rect{fill:#D9D9FF}
.qlens-tech .chip text{font-size:10px;fill:#2A288C;letter-spacing:.08em}
.qlens-tech .leader{fill:none;stroke:#303030;stroke-width:.75}
.qlens-tech .leader-dot{fill:#303030}
.qlens-tech .name{font-size:15px;fill:#303030;font-weight:500}
.qlens-tech .stage{font-size:10px;fill:#8A8A99;letter-spacing:.14em}
.qlens-tech .card-bg{fill:#fff;stroke:#E6E6F0;stroke-width:1}
.qlens-tech .card-rule{stroke:#E6E6F0;stroke-width:1}
.qlens-tech .card-dot{fill:#E6E6F0}
.qlens-tech .out .card-dot{fill:#2A288C}
.qlens-tech .hdr{font-size:12px;fill:#303030}
.qlens-tech .hdr .m{fill:#8A8A99}
.qlens-tech .jl{font-size:12px;fill:#8A8A99}
.qlens-tech .jl .k{fill:#8A8A99}
.qlens-tech .in .v{fill:#303030}
.qlens-tech .out .v{fill:#2A288C}
.qlens-tech .status rect{fill:#fff;stroke:#E6E6F0}
.qlens-tech .status text{font-size:10px;fill:#303030;letter-spacing:.12em}
.qlens-tech .status .sdot{fill:#FF7869}
.qlens-tech .status.done .sdot{fill:#2A288C}
</style>
</head>
