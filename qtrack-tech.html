<!doctype html>

<head>

<title>qTrack Loop</title>

<style>
body{margin:0;background:#fff;display:grid;place-items:center;min-height:100vh}
.qtrack-tech-wrap{width:min(1280px,100% - 32px);margin:0 auto;overflow:hidden}
/* ---- component ---- */
.qtrack-tech{display:block;width:100%;height:auto;font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.qtrack-tech .mono{font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.qtrack-tech #qtr-dots circle{fill:#D9D9FF;fill-opacity:.4}
.qtrack-tech .reg{fill:none;stroke:#C9C9D4;stroke-width:1}
.qtrack-tech .edge{fill:none;stroke:#303030;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.qtrack-tech .inner{fill:none;stroke:#303030;stroke-opacity:.12;stroke-width:1}
.qtrack-tech .glyph{stroke:#303030}
.qtrack-tech .hero .edge,.qtrack-tech .hero .glyph{stroke:#E0574A}
.qtrack-tech .hero .inner{stroke:#E0574A;stroke-opacity:.35}
.qtrack-tech #qtrack-rings{fill:none;stroke:#FF7869;stroke-width:1.25}
.qtrack-tech #connectors path{fill:none;stroke:#303030;stroke-width:1;stroke-linejoin:round}
.qtrack-tech #connectors #wb-march{stroke:#FF7869;stroke-width:1.5;stroke-dasharray:4 6;stroke-linecap:round;opacity:0}
.qtrack-tech #links path{fill:none;stroke:#8A8A99;stroke-width:1}
.qtrack-tech .up{opacity:.5}
.qtrack-tech .up-edge{fill:none;stroke:#8A8A99;stroke-width:1.25;stroke-dasharray:3 3;stroke-linejoin:round;stroke-linecap:round}
.qtrack-tech #up-lines path{fill:none;stroke:#C9C9D4;stroke-width:1;stroke-dasharray:3 4}
.qtrack-tech .up-lbl text{font-size:10px;fill:#8A8A99;letter-spacing:.12em}
.qtrack-tech .up-lbl .leader{stroke:#C9C9D4}
.qtrack-tech .tag rect{fill:#fff;stroke:#FF7869;stroke-width:.75}
.qtrack-tech .up-lbl .tag text{font-size:7px;fill:#FF7869;letter-spacing:.14em}
.qtrack-tech .leader{fill:none;stroke:#303030;stroke-width:.75}
.qtrack-tech .leader-dot{fill:#303030}
.qtrack-tech .name{font-size:15px;fill:#303030;font-weight:500}
.qtrack-tech .stage{font-size:10px;fill:#8A8A99;letter-spacing:.14em}
.qtrack-tech .frame-bg{fill:#fff;stroke:#E6E6F0;stroke-width:1}
.qtrack-tech .frame-rule{fill:none;stroke:#E6E6F0;stroke-width:1}
.qtrack-tech .chrome-dots{fill:#ECECF2}
.qtrack-tech .sk{fill:#DDDDE6}
.qtrack-tech .sk-l{fill:#ECECF2}
.qtrack-tech .sk-d{fill:#DDDDE6}
.qtrack-tech .flag{fill:#FF7869}
.qtrack-tech .slot{fill:#ECECF2}
.qtrack-tech .slot.booked{fill:#FF7869}
.qtrack-tech .dot-i{fill:#2A288C}
.qtrack-tech .status rect{fill:#fff;stroke:#E6E6F0}
.qtrack-tech .status text{font-size:10px;fill:#303030;letter-spacing:.12em}
.qtrack-tech .status .sdot{fill:#FF7869}
.qtrack-tech .status.done .sdot{fill:#2A288C}
.qtrack-tech .status.done text{fill:#2A288C}
/* below 640px: frames hidden, crop to the cube loop and enlarge type */
@media (max-width:639px){
.qtrack-tech-wrap{aspect-ratio:690/634}
.qtrack-tech{width:198.93%;margin:0 0 0 -49.275%}
.qtrack-tech #frames,.qtrack-tech #links{display:none}
.qtrack-tech .lt,.qtrack-tech .ut,.qtrack-tech .status{transform-box:fill-box;transform:scale(1.8)}
.qtrack-tech .label .lt{transform-origin:50% 100%}
.qtrack-tech .wb-lbl .lt{transform-origin:0 0}
.qtrack-tech .ut{transform-origin:100% 50%}
.qtrack-tech .status{transform:scale(1.4);transform-origin:0 50%}
}
</style>
</head>
